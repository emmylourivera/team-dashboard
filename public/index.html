function hexRgb(h){ h=String(h).replace("#",""); return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)||0); }
function rgbHex(c){ return "#"+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join(""); }
function sampleBg(g,b){
  const w=Math.max(1,b[2]-b[0]),h=Math.max(1,b[3]-b[1]),d=g.getImageData(b[0],b[1],w,h).data,m=new Map(),all=new Map();
  for(let i=0;i<d.length;i+=8){ const q=[d[i]>>2<<2,d[i+1]>>2<<2,d[i+2]>>2<<2], key=q.join(","); all.set(key,(all.get(key)||0)+1); if(q[0]+q[1]+q[2]>450) m.set(key,(m.get(key)||0)+1); }
  const src=m.size?m:all; let best="255,255,255",n=-1; src.forEach((v,k)=>{ if(v>n){ n=v; best=k; } });
  return best.split(",").map(v=>Math.min(255,Number(v)+2));
}
function cleanPanel(g,b,bg,flat,s){
  const ins=2,x0=b[0]+ins,y0=b[1]+ins,w=Math.max(1,b[2]-b[0]-2*ins),h=Math.max(1,b[3]-b[1]-2*ins);
  const id=g.getImageData(x0,y0,w,h),p=id.data,m=new Uint8Array(w*h);
  for(let i=0,j=0;j<m.length;j++,i+=4){ const R=p[i],G=p[i+1],B=p[i+2];
    if((B-R>40&&B>170)||(R-G>50&&R>180)||(B-G>12&&R-G>4&&R+G+B>300)) m[j]=1; }
  const m2=new Uint8Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ if(!m[y*w+x]) continue; for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const yy=y+dy,xx=x+dx; if(yy>=0&&yy<h&&xx>=0&&xx<w) m2[yy*w+xx]=1; } }
  for(let i=0,j=0;j<m2.length;j++,i+=4){ if(m2[j]||(flat&&p[i]+p[i+1]+p[i+2]>560)){ p[i]=bg[0]; p[i+1]=bg[1]; p[i+2]=bg[2]; } }
  const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").putImageData(id,0,0);
  const k=Math.max(1,Math.min(s,4096/Math.max(w,h)));
  if(k<=1) return c;
  const o=document.createElement("canvas"); o.width=Math.round(w*k); o.height=Math.round(h*k);
  const og=o.getContext("2d"); og.imageSmoothingEnabled=true; og.imageSmoothingQuality="high"; og.drawImage(c,0,0,o.width,o.height); return o;
}
function makeTextures(r){
  const P=r.cfg.panels,g=r.canvas.getContext("2d",{willReadFrequently:true});
  const bg=r.cfg.bg?hexRgb(r.cfg.bg):sampleBg(g,P.back||P.front);
  const s=Math.max(1,Math.min(6,Math.round(1100/Math.max(1,P.front[3]-P.front[1])))), flat=new Set(r.cfg.flat||[]);
  const tex={bg:rgbHex(bg)};
  RENDER_PANELS.forEach(k=>{ const b=P[k]&&normBox(P[k],r.w,r.h); if(b) tex[k]=cleanPanel(g,b,bg,flat.has(k),s); });
  const [W,D,H]=r.cfg.dims.map(Number); return {tex,opts:{W,D,H,hang:r.cfg.hang||null}};
}

/* --- the 3D stage (port of the skill's viewer) --- */
const R3D={el:null,renderer:null,built:false,running:false,anim:null,views:{}};
function stageEl(){
  if(R3D.el) return R3D.el;
  const el=document.createElement("div"); el.className="r3d";
  const cap=document.createElement("div"); cap.className="r3d-cap"; cap.textContent="Loading 3D…"; el.appendChild(cap); R3D.cap=cap;
  const bar=document.createElement("div"); bar.className="r3d-bar"; bar.setAttribute("role","toolbar"); bar.setAttribute("aria-label","Camera views");
  [["hero","3/4 view"],["front","Front"],["back","Back"],["side","Side"],["top","Top"]].forEach(([v,l],i)=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=l; b.dataset.v=v; b.setAttribute("aria-pressed",i?"false":"true");
    b.onclick=()=>{ R3D.btns.forEach(x=>x.setAttribute("aria-pressed",String(x===b))); goView(v); }; bar.appendChild(b); });
  const spin=document.createElement("button"); spin.type="button"; spin.textContent="Spin"; spin.setAttribute("aria-pressed","false");
  spin.onclick=()=>{ if(!R3D.controls) return; R3D.controls.autoRotate=!R3D.controls.autoRotate; spin.setAttribute("aria-pressed",String(R3D.controls.autoRotate)); };
  bar.appendChild(spin);
  const dl=document.createElement("button"); dl.type="button"; dl.textContent="Download PNG"; dl.className="r3d-dl"; dl.hidden=true;
  dl.onclick=()=>exportPng(dl); bar.appendChild(dl); R3D.dlBtn=dl;
  getDownloads().then(d=>{ dl.hidden=!d; });
  el.appendChild(bar);
  R3D.btns=[...bar.querySelectorAll("[data-v]")]; R3D.el=el; return el;
}
function ensureStage(){
  if(R3D.renderer) return;
  const THREE=window.THREE, el=stageEl();
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.domElement.setAttribute("aria-label","3D carton mockup. Drag to rotate, scroll or pinch to zoom.");
  el.insertBefore(renderer.domElement,el.firstChild);
  const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(30,1,1,4000);
  const controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true; controls.enablePan=false; controls.autoRotateSpeed=1.6;
  controls.addEventListener("start",()=>{ R3D.anim=null; R3D.btns.forEach(x=>x.setAttribute("aria-pressed","false")); });
  scene.add(new THREE.HemisphereLight(0xffffff,0xd8d4cc,0.85));
  const key=new THREE.DirectionalLight(0xffffff,0.55); key.castShadow=true; key.shadow.mapSize.set(2048,2048); key.shadow.radius=6; scene.add(key);
  const fill=new THREE.DirectionalLight(0xffffff,0.25); scene.add(fill);
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),new THREE.ShadowMaterial({opacity:0.12}));
  floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
  Object.assign(R3D,{renderer,scene,camera,controls,key,fill,floor});
  if(window.ResizeObserver) new ResizeObserver(()=>resize3d()).observe(el); else window.addEventListener("resize",resize3d);
  resize3d();
}
function resize3d(){ const {renderer,camera,el}=R3D; if(!renderer) return; const w=el.clientWidth,h=el.clientHeight; if(!w||!h) return; renderer.setSize(w,h); camera.aspect=w/h; camera.fov=w<h?42:30; camera.updateProjectionMatrix(); }
function disposeObj(o){ o.traverse(x=>{ if(x.geometry) x.geometry.dispose(); const ms=Array.isArray(x.material)?x.material:(x.material?[x.material]:[]); ms.forEach(m=>{ if(m.map) m.map.dispose(); m.dispose(); }); }); }
function buildCarton(T,O){
  const THREE=window.THREE, {scene,renderer,camera,controls,key,fill,floor}=R3D;
  if(R3D.carton){ scene.remove(R3D.carton); disposeObj(R3D.carton); }
  const W=O.W,H=O.H,D=O.D,HT=O.hang,HANG=HT?HT.height_mm:0,HW=HT?HT.width_mm:W;
  const SZ=Math.max(W,H+HANG,D), aniso=renderer.capabilities.getMaxAnisotropy();
  const mat=c=>{ const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=aniso; return new THREE.MeshStandardMaterial({map:t,roughness:0.55,metalness:0}); };
  const plain=()=>new THREE.MeshStandardMaterial({color:new THREE.Color(T.bg).convertSRGBToLinear(),roughness:0.55});
  const m=k=>T[k]?mat(T[k]):plain();
  // +x right, -x left, +y top, -y bottom, +z front, -z back
  const box=new THREE.Mesh(new THREE.BoxGeometry(W,H,D),[m("right"),m("left"),m("top"),m("bottom"),m("front"),m("back")]);
  box.castShadow=true; box.receiveShadow=true;
  const carton=new THREE.Group(); carton.add(box);
  if(HT){
    const c=document.createElement("canvas"); c.width=1600; c.height=Math.max(2,Math.round(1600*HANG/HW));
    const g=c.getContext("2d"); g.fillStyle=T.bg; g.fillRect(0,0,c.width,c.height);
    const s=c.width/HW; g.globalCompositeOperation="destination-out"; const cx=c.width/2, sy=c.height*0.55;
    if(HT.slot==="round"){ g.beginPath(); g.arc(cx,sy,3.2*s,0,Math.PI*2); g.fill(); }
    else if(HT.slot!=="none"){ const sw=26*s,sh=6.5*s; g.beginPath(); if(g.roundRect) g.roundRect(cx-sw/2,sy-sh/2,sw,sh,sh/2); else g.rect(cx-sw/2,sy-sh/2,sw,sh); g.fill();
      g.beginPath(); g.arc(cx,sy-sh/2,4.2*s,Math.PI,0); g.fill(); g.fillRect(cx-4.2*s,sy-sh/2-0.5,8.4*s,sh/2); }
    const ht=new THREE.CanvasTexture(c); ht.encoding=THREE.sRGBEncoding; ht.anisotropy=aniso;
    const hm=new THREE.MeshStandardMaterial({map:ht,roughness:0.55,alphaTest:0.5,side:THREE.DoubleSide}), geo=new THREE.PlaneGeometry(HW,HANG);
    for(const z of [-D/2+0.35,-D/2+0.9]){ const p=new THREE.Mesh(geo,hm); p.position.set(0,H/2+HANG/2,z); p.castShadow=true; carton.add(p); }
  }
  const BOT=-(H+HANG)/2; carton.position.y=BOT+H/2; scene.add(carton); R3D.carton=carton; floor.position.y=BOT;
  key.position.set(SZ*0.8,SZ*2.6,SZ*2.2); fill.position.set(-SZ*1.4,SZ*0.6,-SZ);
  Object.assign(key.shadow.camera,{left:-SZ*2,right:SZ*2,top:SZ*2,bottom:-SZ*2,near:1,far:SZ*12}); key.shadow.camera.updateProjectionMatrix();
  controls.target.set(0,0,0); controls.minDistance=SZ*1.1; controls.maxDistance=SZ*6;
  const R=SZ*3.3; R3D.views={hero:[R*0.5,R*0.26,R*0.8],front:[0,R*0.04,R],back:[0,R*0.04,-R],side:[R,R*0.04,0],top:[0.01,R,R*0.17]};
  R3D.anim=null; camera.position.set(...R3D.views.hero); R3D.btns.forEach((x,i)=>x.setAttribute("aria-pressed",String(i===0)));
  R3D.cap.textContent="Drag to rotate · scroll or pinch to zoom";
}
function goView(v){
  if(!R3D.camera||!R3D.views[v]) return; const THREE=window.THREE;
  const from=R3D.camera.position.clone(), to=new THREE.Vector3(...R3D.views[v]), t0=performance.now();
  R3D.anim=now=>{ const k=Math.min(1,(now-t0)/700), e=1-Math.pow(1-k,3); R3D.camera.position.lerpVectors(from,to,e); if(k>=1) R3D.anim=null; };
}
function startLoop(){
  if(R3D.running||!R3D.renderer) return; R3D.running=true;
  const tick=now=>{ if(!R3D.el.isConnected){ R3D.running=false; return; } if(R3D.anim) R3D.anim(now); R3D.controls.update(); R3D.renderer.render(R3D.scene,R3D.camera); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
function mountRender(){
  const slot=$("#r3dSlot"); if(!slot) return;
  slot.appendChild(stageEl());
  if(R3D.renderer){ resize3d(); startLoop(); }
}
let dlNs;
async function getDownloads(){ if(dlNs===undefined){ try{ dlNs=window.claude&&window.claude.use?await window.claude.use("downloads"):null; }catch(e){ dlNs=null; } } return dlNs; }
async function exportPng(btn){
  const d=await getDownloads(), {renderer,scene,camera,el}=R3D; if(!d||!renderer||!R3D.built) return;
  btn.disabled=true; const label=btn.textContent; btn.textContent="Preparing…";
  let blob=null;
  try{
    const w=el.clientWidth,h=el.clientHeight,old=renderer.getPixelRatio();
    renderer.setPixelRatio(Math.min(6,2400/Math.max(w,h,1))); renderer.setSize(w,h,false);
    renderer.render(scene,camera);
    blob=await new Promise(res=>renderer.domElement.toBlob(res,"image/png"));
    renderer.setPixelRatio(old); renderer.setSize(w,h,false); resize3d();
  }catch(e){}
  btn.disabled=false; btn.textContent=label;
  if(!blob){ toast("The image couldn't be made. Try again."); return; }
  const base=String((S.rnd&&S.rnd.name)||"Mockup").replace(/[^\w\- ]+/g,"").trim()||"Mockup";
  try{ await d.save({filename:`${base} 3D mockup.png`,data:blob}); toast("Mockup image saved."); }
  catch(e){ const c=e&&e.code; if(c==="declined") return; toast(c==="rate_limited"?"A download is already waiting for you to confirm.":"The download isn't available here."); if(["unavailable","not_granted","capability_disabled","capability_removed"].includes(c)) btn.hidden=true; }
}
let rbTimer=0;
function rebuild3d(){ clearTimeout(rbTimer); rbTimer=setTimeout(()=>{ rebuild3dNow().catch(()=>{ if(S.rnd){ S.rnd.err3d="The 3D view couldn't load. Check your connection and reopen this page."; render(); } }); },80); }
async function rebuild3dNow(){
  const r=S.rnd; if(!r||!r.canvas||!r.cfg||!r.cfg.panels.front) return;
  await loadThree(); if(S.rnd!==r) return;
  ensureStage(); const {tex,opts}=makeTextures(r); buildCarton(tex,opts);
  R3D.built=true; if(r.err3d){ r.err3d=""; render(); } mountRender();
}

/* --- save / reopen --- */
async function saveRender(){
  const r=S.rnd; if(!r||!r.cfg||r.saving) return;
  if(!(S.mode==="db"&&S.assets&&S.canWrite)){ toast("Saving renders needs edit access to this page."); return; }
  r.saving=true; render();
  try{
    let die=r.asset;
    if(!die&&r.file){ const res=await S.assets.upload(r.file); die={id:res.id,name:r.file.name,type:res.contentType||r.file.type}; r.asset=die; }
    let thumb=null;
    if(R3D.renderer&&R3D.built){ R3D.renderer.render(R3D.scene,R3D.camera);
      const b=await new Promise(res=>R3D.renderer.domElement.toBlob(res,"image/png"));
      if(b){ try{ const t=await S.assets.upload(new File([b],"render-3d.png",{type:"image/png"})); thumb={id:t.id,name:"render-3d.png",type:"image/png"}; }catch(e){} } }
    const doc={name:(r.name||"Untitled render").slice(0,120),dieline:die||null,cfg:r.cfg,size:[r.w,r.h],thumb,skuId:r.skuId||"",by:r.by||S.me||"",at:new Date().toISOString()};
    if(r.savedId&&S.me&&r.by&&r.by!==S.me) doc.updatedBy=S.me;
    if(r.savedId) await S.db.collection("renders").doc(r.savedId).set(doc);
    else { const ref=await S.db.collection("renders").add(doc); r.savedId=ref&&ref.id||null; }
    toast("Render saved.");
  }catch(e){ toast(e&&e.code==="invalid_argument"?"You can view renders but not save them.":e&&e.code==="too_large"?"The dieline file is too large to save.":"The render wasn't saved. Try again."); }
  finally{ r.saving=false; render(); }
}
function openSaved(id){
  const x=S.renders.find(v=>v.id===id); if(!x) return;
  if(!x.dieline){ toast("This render has no dieline file to open."); return; }
  openDieline(()=>assetToCanvas(x.dieline),{name:x.name,asset:x.dieline,cfg:x.cfg,size:x.size,savedId:x.id,by:x.by,skuId:cadSku(x)||""});
}
function renderFromTemplate(id){

  const t=S.templates.find(v=>v.id===id); if(!t||!t.file) return;
  openDieline(()=>assetToCanvas(t.file),{name:String(t.name||"Dieline").replace(/\.[a-z0-9]+$/i,""),asset:t.file,skuId:t.skuId||""});

function overlaySvg(r){
  if(!r.cfg) return ""; const P=r.cfg.panels, fs=Math.round(Math.max(r.w,r.h)*0.016);
  return `<svg viewBox="0 0 ${r.w} ${r.h}" preserveAspectRatio="none" aria-hidden="true">${RENDER_PANELS.filter(k=>P[k]).map(k=>{ const [x0,y0,x1,y1]=P[k];
    return `<rect class="rbox${k==="front"?" front":""}" x="${x0}" y="${y0}" width="${Math.max(1,x1-x0)}" height="${Math.max(1,y1-y0)}"/><text class="rlbl" x="${(x0+x1)/2}" y="${(y0+y1)/2}" font-size="${fs}" stroke-width="${Math.max(1,fs*0.18)}" text-anchor="middle" dominant-baseline="middle">${k}</text>`; }).join("")}</svg>`;
}
function adjustHtml(r){

  return `<details class="rdet" data-rdet${r.open?" open":""}><summary>Size and panels</summary>
    <div class="rrow3" style="margin-top:12px">${["Width","Depth","Height"].map((l,i)=>`<label class="rlab">${l} (mm)<input class="rin" type="number" step="any" min="1" data-rd="${i}" value="${esc(fmtNum(c.dims[i]))}"></label>`).join("")}</div>
    <div class="rrow3" style="margin-top:10px"><label class="rlab">Hang tab<select class="rin" data-rh="slot"><option value="">None</option>${[["euro","Euro hole"],["round","Round hole"],["none","No hole"]].map(([v,l])=>`<option value="${v}"${h&&h.slot===v?" selected":""}>${l}</option>`).join("")}</select></label>
      <label class="rlab">Tab width (mm)<input class="rin" type="number" step="any" min="1" data-rh="width_mm" value="${h?esc(fmtNum(h.width_mm)):""}"${h?"":" disabled"}></label>
      <label class="rlab">Tab height (mm)<input class="rin" type="number" step="any" min="1" data-rh="height_mm" value="${h?esc(fmtNum(h.height_mm)):""}"${h?"":" disabled"}></label></div>

    <p class="note" style="margin:8px 0 0">Edges are pixels on the uploaded dieline (${r.w} × ${r.h}). Clear a panel's numbers to show plain board there.</p></details>`;
}

S.helpQ="";
const HELP=[
 {t:"Getting started",b:`<p>This workspace keeps every creative request, its files, chat and timeline in one place, plus the SKU catalog and, for the Product team, the product master list and vendors.</p><ul><li><b>Your role</b> is set by an admin under People &amp; roles, and shows in the round button at the top right (your initials). The sidebar and buttons match it.</li><li>Roles: <b>Creative designer</b>, <b>Creative lead</b>, <b>Copywriter</b>, <b>Project manager</b>, <b>Marketing team</b>, <b>Product team</b> and <b>Vendor</b>. See "Who can do what" below.</li><li>The <b>Dashboard</b> shows what needs you first: your projects, requests, approvals or vendor requests, plus all-time stats.</li></ul>`},
 {t:"People, roles and signing in",b:`<p>Everyone signs in with their Kitsch work account, and each person's role is set by an admin, so the view they get matches their job.</p><ol><li>The workspace owner opens <b>People &amp; roles</b> (in the sidebar, visible only to the owner), searches for the person, picks a role and clicks <b>Add</b>.</li><li>Kitsch teammates can already sign in. Outside vendors need a sign-in from IT, who also puts them on the read-only list.</li><li>The person opens the link and signs in. They land in their role's view and can't switch roles themselves.</li></ol><p>Only the <b>workspace owner</b> sees People &amp; roles: adding people, changing or removing roles, approving requests and the visitors list. The <b>Admin</b> role (and anyone IT lists as an editor) can preview every role with <b>View as</b> in the account menu, but doesn't see People &amp; roles. Someone without a role sees a "You don't have access yet" screen with a <b>Request access</b> button: they pick the role they need and add a note, and the request shows at the top of People &amp; roles (with a red dot on the owner's account button) for the owner to approve or decline.</p><p>People added as Creative lead, Creative designer or Copywriter appear automatically in the project manager's assign lists.</p>`},
 {t:"How this app uses data",b:`<ul><li><b>Where it's stored</b>: projects, requests, chat, file comments, SKUs, vendors, colors, templates and uploaded files are saved in the Team Dashboard database that Kitsch IT runs. The only outside service is Claude, for the AI features below.</li><li><b>Who can see it</b>: everyone who can sign in to the dashboard. Roles decide which screens each person sees, but they don't lock the data itself, so don't put anything here that some teammates shouldn't see.</li><li><b>Signing in</b>: you sign in with your Kitsch work account. The app uses your name and email address to show who did what. It doesn't read your inbox or other accounts.</li><li><b>What's recorded</b>: an activity log for notifications (who changed what, and when), and for the workspace owner only, who has opened the workspace and when, plus access requests.</li><li><b>AI features</b>: the print proof check and Mockup Studio's panel detection send the file you're checking to Claude to read it. Results are saved with the project; nothing else is shared.</li><li><b>On this device</b>: a few settings, like light or dark mode and which notifications you've read, are remembered in your browser only.</li><li><b>Removing data</b>: project managers can delete projects, and the workspace owner can remove people. Ask the owner if something needs to be taken out.</li></ul>`},
 {t:"Who can do what",b:`<ul><li><b>Creative designer</b>: works on assigned projects, uploads versions, ticks Internal review, uses Mockup Studio and the print proof check. SKU pages are view only.</li><li><b>Creative lead</b>: everything a designer does, ticks External review, and is the only role that edits the creative side of a SKU: product image, colors, files (Dropbox assets, dieline, CAD/artwork/tech pack links) and color approvals.</li><li><b>Copywriter</b>: sees only Copywriting requests, on the dashboard and the Requests tab. Chats and comments on files and runs the print proof check on copy. Doesn't see other projects, Digital assets, SKU or Mockup Studio.</li><li><b>Admin</b>: can switch between every role's view with <b>View as</b>. Can't see People &amp; roles, add people or change roles; that stays with the workspace owner.</li><li><b>Project manager</b>: sees every request, assigns a lead and designer, and can release and delete projects.</li><li><b>Marketing team</b>: submits requests and gives the final creative approval.</li><li><b>Product team</b>: keeps the product master list up to date and runs the Vendors hub. Sees and can submit only vendor, SKU, copywriting and print design requests (tech packs, spec sheets, CAD, barcodes, packaging artwork, sell sheets, visual merchandising and copywriting), on the dashboard and the Requests tab. Sees the SKU and Vendors hub pages instead of Digital assets. Creative info on their SKUs is view only.</li></ul><p><p><b>Vendor</b>: each vendor account is linked to one vendor on People &amp; roles, and sees only that vendor's SKUs (matched on the SKU's Vendor field and the vendor's "Also listed as" names in the Vendors hub) and the vendor requests for those SKUs (tech packs, spec sheets, packaging artwork, barcodes and CADs), all view only. Vendors don't see projects, Digital assets, Mockup Studio or the Vendors hub.</p><p>Roles are assigned by an admin. They shape what each person sees and can do in the app; the company sign-in and the read-only list set by IT are what the server itself enforces.</p>`},
 {t:"Saving working and final files (Google Drive)",b:`<p>Every project's files live in one shared Google Drive folder, <b>CREATIVE REQUEST</b>. Keep this structure so anyone can find any file:</p>
<pre class="kb-tree">CREATIVE REQUEST
└─ Creative Request 2026          ← the working year
   └─ TP - Tech Pack               ← category, with its code
      └─ 26105_TP                  ← the project number
         ├─ CRA                    ← creative request assets
         ├─ WORKING FILES          ← your working files and rounds
         └─ FINAL / RELEASE        ← final and release assets</pre>
<ol><li>Open <b>CREATIVE REQUEST</b>, then the folder for the current year (for example <b>Creative Request 2026</b>).</li><li>Open the category folder for the type of request, named with its code (see the list below).</li><li>Make a folder named with the <b>project number</b> shown on the project (for example 26105_TP).</li><li>Inside it, make three folders:<ul><li><b>CRA</b>: the creative request assets (briefs, references, copy, product photos from the requestor).</li><li><b>WORKING FILES</b>: your working files and every round of work.</li><li><b>FINAL / RELEASE</b>: only the approved final files and the assets released to the team or vendor.</li></ul></li><li>Paste the project folder's link into the project's <b>Shared drive / doc link</b> so everyone can open it from here.</li></ol>
<p><b>Category codes</b></p><ul class="kb-codes">${OPTS.type.map(t=>`<li><b>${TYPE_CODE[t]||""}</b> ${t}</li>`).join("")}</ul>
<p>Upload each round to the project's <b>Project versions</b> here too, so it can be reviewed and commented on. The Drive folder holds the source files.</p>`},
 {t:"Submit a new request",b:`<ol><li>Click <b>New request</b> in the sidebar (Marketing team, Product team and Project managers).</li><li>Name the request, pick a due date, type of request and department.</li><li>Add the SKU(s) it's for. Start typing a SKU number, name or UPC and pick from the list. Choose "New SKU" if it isn't in the catalog yet.</li><li>Describe what you need, paste a shared drive link and attach briefs or references.</li><li>Click <b>Submit request</b>. It shows on the Project manager's dashboard as a new request.</li></ol>`},
 {t:"Assign a request (Project managers)",b:`<p>New requests are listed on the Project manager's dashboard. Pick a <b>creative lead</b> and a <b>designer</b> for each one, then click <b>Assign</b>. The request becomes a project and moves to <b>In creative</b>. To put more than one designer on a project, open it and use <b>+ Add designer</b> under Creative designers.</p>`},
 {t:"Working in a project",b:`<p>Open any project from My Projects, All Projects or the dashboard. The panel shows:</p><ul><li><b>Project versions</b>: upload each round of work for feedback and review. Versions aren't final files and aren't used anywhere else; final files live in the project's FINAL / RELEASE folder on Google Drive.</li><li><b>Project chat</b>: talk about the project with everyone involved. Press Enter to send, Shift+Enter for a new line. Click the paperclip (or paste) to attach images or files.</li><li><b>Project timeline</b>: the approval steps (see the next article).</li><li><b>SKU</b>: product image, SKU, UPC, HTS code and size from the SKU catalog, plus its colors, files and dieline. Only creative leads can change the product image here.</li><li><b>Project request</b>: the original brief, link and request files.</li></ul>`},
 {t:"Timeline and status",b:`<p>Ticking a box on the project timeline moves the status forward:</p><ol><li><b>Ready for revisions</b> (on each version, in the file viewer): ticked by the creative lead once feedback on that version is in, so the designer knows to start revising. Ticking it also unticks <b>Internal review</b> on the timeline, so the designer ticks it again when the revision is ready. The version shows a "Ready for revisions" tag and the designer gets a notification.</li><li><b>Internal review</b>: ticked by the designer.</li><li><b>External review</b>: ticked by the creative lead.</li><li><b>Creative approval</b>: ticked by the requestor, which sets the status to Approved.</li><li><b>Released</b>: ticked by the project manager, designer or creative lead. This marks the project Completed and records the date.</li></ol><p>Use <b>Put on hold</b> to pause a project and <b>Resume project</b> to pick it back up.</p>`},
 {t:"Reviewing files and pinning comments",b:`<p>Click any file to open it full screen. Comments for that file are on the right.</p><ul><li>On an image, click a spot to <b>pin</b> your comment to it. Pins are numbered on the image and in the comment list.</li><li>Use the arrows (or the ← → keys) to move between files.</li><li><b>Open original</b> opens the file in a new tab.</li></ul>`},
 {t:"Digital assets and templates",b:`<p><b>Templates</b> holds reusable files: banners, tech packs, dielines, social media templates and any new types your team adds. Assets are added by hand, and only creative leads and designers can add, link or remove them; every other role can browse and open them. Each one can be linked to the completed project that used it. The link shows on the asset and inside that project.</p><ol><li>Click <b>Add creative</b>.</li><li>Pick the type of creative, or choose <b>New type…</b> to make a new section.</li><li>Choose <b>Upload files</b>, or <b>Add a link</b> for files kept on Dropbox, Google Drive or Figma.</li></ol><p>InDesign (.indd) files can't be stored here, so add them as a link to the shared drive.</p>`},
 {t:"Dielines",b:`<p>Under Digital assets › Templates › Dielines you'll find every dieline listed in the SKU catalog: its number, product lines, the SKUs that use it and the linked file. Search by dieline number, SKU or product line. Dieline files your team uploads appear below the list.</p>`},
 {t:"Mockup Studio (3D mockups)",b:`<p>For creative leads and designers.</p><ol><li>Open <b>Mockup Studio</b> and upload a flat carton dieline (PNG, JPG or PDF). You can also click <b>Render 3D</b> on a dieline in Templates.</li><li>The panels are detected for you and the artwork is folded onto a true-scale 3D box. Drag to rotate, scroll or pinch to zoom, or use the view buttons.</li><li>If a panel or the size is off, open <b>Size and panels</b> to fix the width, depth and height in mm, the hang tab or a panel's edges.</li><li>Click <b>Save render</b> to keep it under Saved renders for the team.</li></ol><p>For the sharpest result, upload a PDF or a 300 dpi PNG.</p>`},
 {t:"SKU catalog and PMS colors",b:`<p>The <b>SKU</b> page lists every SKU on the Product team's list, grouped by product line, plus creative-only SKUs that aren't on it yet. Each SKU shows its UPC, HTS code, size, vendor, colors, files, digital assets and related completed projects. Color approvals show only in the Creative lead view. Creative leads and designers also see the Product team's <b>Copy</b> section (web and packaging copy docs, summaries, features, how to use and channel names), view only.</p><ul><li><b>From the Product team</b>: style #, category, UPC, HTS code and packaged size and weight. These update whenever the Product team saves.</li><li><b>Edited by creative leads</b>: product image, <b>Colors</b>, <b>Files</b> (Dropbox assets link, dieline number and file, CAD, artwork and tech pack links) and <b>Color approvals</b>. Click <b>Edit</b> on the section, make changes, then <b>Save</b> or <b>Cancel</b>.</li><li>Everything else is view only for every role.</li></ul><p>A color approval belongs to its PMS color, so editing or removing one changes it on every SKU that shares that approval. Adding an approval with a new PMS code adds that color to the <b>PMS colors</b> tab.</p><p>The <b>PMS colors</b> tab shows each Pantone color with its L*a*b* values, color approvals and the SKUs that use it. Screen swatches are previews only, so match to the approved chip.</p>`},
 {t:"Product team: keeping SKU details up to date",b:`<p>In the <b>Product team</b> role, the <b>SKU</b> page shows the product master list. It holds every SKU from the product sheet, grouped by category, and feeds the SKU catalog every other role sees.</p><ol><li>Search by style #, UPC or name, or filter by active status, category, customer or season.</li><li>Open a SKU. Its details are split into sections that match the sheet: product details, certifications, product attributes, certificates, ownership, dimensions with and without packaging, case and carton, copy, creative and retail doors. Click a section to open or close it.</li><li>Fields are locked until you click <b>Edit</b> inside an open section. Changed fields are shaded.</li><li>Click <b>Save</b> in that section (or press Ctrl/Cmd+S) to save it, or <b>Cancel</b> to drop the changes. Each save records who saved it and when.</li><li>Use <b>+</b> at the top of the list to add a new SKU.</li></ol><p>Style #, category, UPC, HTS code and packaged size and weight show up straight away in the SKU catalog for other roles.</p><p>The <b>Creative</b> section is view only for the Product team. It shows the Dropbox asset link, colors, files and color approvals that creative leads keep up to date in the creative catalog, matched by style #.</p>`},
 {t:"Product team: Vendors hub",b:`<p>The <b>Vendors hub</b> is only in the Product team's sidebar. It lists every vendor with their status, type, contacts, terms, compliance notes and shared drive folder.</p><ol><li>Search by vendor, contact or country, then pick a vendor to see its details, the SKUs that list it in the SKU catalog, and the requests for those SKUs.</li><li>Click <b>Edit</b> on a section (Company, Contact, Terms, Compliance or Notes), change it, then click <b>Save</b> (or <b>Cancel</b>).</li><li>Use <b>+</b> to add a vendor. Add other names or codes the vendor goes by under "Also listed as" so their SKUs match.</li></ol>`},
 {t:"Print proof check",b:`<p>Packaging Artwork, Barcode AW Request, Visual Merchandising Request and Sell Sheet projects have a <b>Print proof check</b> in the project panel. It proofreads the copy only.</p><ol><li>Click <b>Check the print file</b> and upload the final print PDF from the project's <b>FINAL / RELEASE</b> folder. The file is only checked, not stored.</li><li>Every panel is read for: <b>spelling errors</b>; <b>grammar issues</b>; <b>inconsistent capitalization or formatting</b>; anything that reads <b>awkwardly or could be misread</b>; and the front of pack using <b>"&amp;" instead of "and"</b> (every "and" on the front is flagged).</li><li>Findings are grouped by those checks, one group open at a time. Each shows the panel, what was found and the exact fix.</li><li>Mark each finding <b>Fixed</b> or <b>Won't fix</b>. Your name and the date are recorded.</li><li>A <b>Quick summary</b> at the end sums up the copy and what to fix first.</li><li>Run it again on the next round. It checks whether the earlier issues were fixed.</li></ol><p>It doesn't check brand, colors, fonts, barcodes, bleed or regulatory content, so those still need a person and the printer's preflight.</p>`},
 {t:"Notifications",b:`<p>The bell at the top right shows new requests, status changes, uploads, chat messages and file comments. A red number means there's something you haven't seen. Click a notification to open that project.</p><p><b>Tagging people</b>: in a project chat or a file comment, type <b>@</b> and pick a name from the list (arrow keys and Enter, or click). The tagged person gets a notification even if they aren't on that project, and their name is highlighted in the message.</p>`},
 {t:"Light and dark mode",b:`<p>Use the half-circle button on the Dashboard to switch between light and dark mode. Your choice is remembered in this browser.</p>`}
];
function helpText(h){ return (h.t+" "+h.b.replace(/<[^>]+>/g," ")).toLowerCase(); }
function renderHelp(){
  const q=S.helpQ.trim().toLowerCase(), list=HELP.filter(h=>!q||helpText(h).includes(q));
  const items=list.map((h,i)=>`<details class="kb-item"${q||i===0?" open":""}><summary>${esc(h.t)}</summary><div class="kb-body">${h.b}</div></details>`).join("");
  return topbar("Help")+`<div class="scroll"><div class="page"><h2 class="h-req">Help</h2><p class="note" style="margin:0 0 16px">How to use the Creative Team workspace.</p>
    <div class="bar-row"><label class="search" style="flex:1;min-width:200px;max-width:420px">${I.search}<span class="sr">Search help</span><input data-search="help" value="${esc(S.helpQ)}" placeholder="Search help…"></label><span class="agroup-n">${list.length} article${list.length===1?"":"s"}</span></div>
    ${list.length?`<div class="kb">${items}</div>`:`<div class="tempty">Nothing matches "${esc(S.helpQ)}". Try another word.</div>`}</div></div>`;
}

/* ---------- Print proof check (from the Kitsch packaging proof skill) ---------- */
const PROOF_TYPES=["Packaging Artwork","Barcode AW Request","Visual Merchandising Request","Sell Sheet"];
function isProofType(r){ return PROOF_TYPES.includes(r.type); }
function canProof(){ return S.canWrite && (isCreative()||isCopy()||S.urole==="Project manager"); }
S.proofs=[]; S.proofRun=null;
const SEV=[["blocker","Blocker"],["fix","Fix"],["consider","Consider"],["verify","Verify"]];
const VERDICT={not_ready:"Not ready for print",ready_after_fixes:"Ready after fixes",approved:"Approved for print"};
function loadLocalProofs(){ try{ return JSON.parse(localStorage.getItem("dam-proofs-v1")||"[]"); }catch(e){ return []; } }
function startProofs(){
  if(S.mode!=="db"){ S.proofs=loadLocalProofs(); return; }
  try{ S.db.collection("proofs").onSnapshot(snap=>{ S.proofs=snap.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))})); scheduleRender(); },()=>{}); }catch(e){}
}
function proofsFor(rid){ return S.proofs.filter(p=>p.rid===rid).sort((a,b)=>String(b.at||"").localeCompare(String(a.at||""))); }
async function saveProof(doc,id){
  if(S.mode!=="db"){ const all=loadLocalProofs(); if(id){ const i=all.findIndex(p=>p.id===id); if(i>=0) all[i]={...all[i],...doc}; } else all.push({id:"p"+Date.now().toString(36),...doc}); try{ localStorage.setItem("dam-proofs-v1",JSON.stringify(all)); }catch(e){} S.proofs=all; scheduleRender(); return; }
  if(id) await S.db.collection("proofs").doc(id).update(doc); else await S.db.collection("proofs").add(doc);
}
function proofCounts(p){ const c={blocker:0,fix:0,consider:0,verify:0}; (p.findings||[]).forEach(f=>{ if(c[f.sev]!=null) c[f.sev]++; }); return c; }
const SEVPL={blocker:"Blockers",fix:"Fixes",verify:"To verify",consider:"Consider"};
/* What the proof check looks for (one accordion group each) */
const PCATS=[["spelling","Spelling errors"],["grammar","Grammar issues"],["format","Capitalization & formatting"],["awkward","Awkward or could be misread"],["ampersand","Front of pack: \"&\" instead of \"and\""]];
const PCAT_SEV={spelling:"fix",grammar:"fix",format:"fix",awkward:"consider",ampersand:"fix"};
function pfCat(f){ return PCATS.some(c=>c[0]===f.cat)?f.cat:("sev:"+f.sev); }
function pfCatLabel(k){ const c=PCATS.find(x=>x[0]===k); return c?c[1]:(SEVPL[k.slice(4)]||"Other"); }
function proofChip(p){ const o=s=>(p.findings||[]).filter(f=>f.sev===s&&f.status==="open").length, b=o("blocker"); return b?`${b} blocker${b===1?"":"s"} open`:o("fix")?`${o("fix")} fix${o("fix")===1?"":"es"} open`:"Ready for print"; }
function openBlockers(rid){ const p=proofsFor(rid)[0]; return p?(p.findings||[]).filter(f=>f.sev==="blocker"&&f.status==="open").length:0; }
function errorsCaught(){ return S.proofs.reduce((n,p)=>n+(p.findings||[]).filter(f=>f.sev==="blocker"||f.sev==="fix").length,0); }

/* --- deterministic checks (ported from preflight.py) --- */
function gtinOk(d){ const n=d.split("").map(Number), chk=n.pop(); let s=0; n.reverse().forEach((v,i)=>{ s+=v*(i%2===0?3:1); }); return (10-(s%10))%10===chk; }
function findBarcodes(text){
  const out=[], seen=new Set();
  String(text).replace(/(?<!\d)(\d[\d ]{10,16}\d)(?!\d)/g,(m)=>{ const d=m.replace(/ /g,""); if((d.length===12||d.length===13)&&!seen.has(d)){ seen.add(d); out.push({digits:d,valid:gtinOk(d)}); } return m; });
  return out;
}
function textHints(text){
  const h=[], t=String(text);
  const dbl=t.match(/\b(\w+)\s+\1\b/gi); if(dbl) h.push("Doubled words: "+[...new Set(dbl)].slice(0,8).join(", ")+".");
  const ands=t.split(/\n+/).filter(l=>/\band\b/i.test(l)).map(l=>l.trim()).filter(Boolean).slice(0,25);
  if(ands.length) h.push("Lines containing the word \"and\" (check which are on the front of pack): "+ands.map(l=>`"${l.slice(0,120)}"`).join(" | "));
  return h;
}
const PROOF_RULES=`PROOF ONLY FOR THESE, nothing else (no brand, color, font, print-readiness, barcode or regulatory review):
1. SPELLING ("spelling"): misspelled words, including real-word swaps (from/form, its/it's, your/you're, compliment/complement), doubled words and missing letters. Check product names, ingredients (INCI) and fine print too.
2. GRAMMAR ("grammar"): agreement, tense, missing or extra words, wrong articles, punctuation that changes meaning, run-ons and fragments in sentences.
3. CAPITALIZATION OR FORMATTING ("format"): the same word or name capitalized differently across panels, mixed sentence case and title case in the same kind of copy, inconsistent units and spacing ("50ml" vs "50 mL"), inconsistent hyphenation, ™/® used inconsistently, straight vs curly quotes, stray or double spaces, inconsistent bullets or numbering.
4. AWKWARD OR COULD BE MISREAD ("awkward"): phrasing that reads awkwardly, is ambiguous or could be misunderstood by a shopper. Flag anything that looks off, even if you're not sure.
5. FRONT OF PACK "&" ("ampersand"): the front of pack must always use "&", never the word "and". Flag every "and" on the front panel (product name, benefit lines, pills, callouts). The back and side panels may use "and".`;
function buildProofPrompt(r,name,pre,prev){
  const cat=catalogSkuFor(r);
  const ctx=[`Project: ${projNo(r)} · ${r.title||""} · type: ${r.type||""}`,
    cat?`SKU catalog: SKU ${cat.sku||""} · ${cat.styleName||""} · category ${cat.category||""} · product line ${cat.line||""} · vendor ${cat.vendor||""} · UPC ${cat.upc||""} · dieline ${cat.dieline||""} · size ${dimsText(cat)||""}`:(r.sku?`SKU ${r.sku} · UPC ${r.upc||""}`:"No SKU linked."),
    r.description?`Brief: ${String(r.description).slice(0,600)}`:""].filter(Boolean).join("\n");
  const _unusedPf=pre.pdf?[`PDF with ${pre.totalPages} page(s)${pre.totalPages>pre.pages.length?`, first ${pre.pages.length} checked`:""}. Page sizes (in): ${pre.pages.map(p=>p.w+"×"+p.h).join(", ")}.`,
      pre.outlined?"Text appears to be outlined (no live text): proof copy visually and say so.":"",
      pre.fonts.length?"Fonts found (name · embedded · kind · sample): "+pre.fonts.map(f=>`${f.name} · ${f.embedded?"embedded":"NOT embedded"} · ${f.kind} · "${f.sample}"`).join(" | "):"",
      "Barcode numbers found in text: "+(pre.barcodes.length?pre.barcodes.map(b=>`${b.digits} (${b.valid?"check digit valid":"CHECK DIGIT INVALID"})`).join(", "):"none"),
      "Text hints: "+textHints(pre.text).join(" ")].filter(Boolean).join("\n")
    :"Flat image file: fonts, page boxes, bleed, color mode and resolution can't be checked. Proof visually and recommend sending the print PDF for a full preflight.";
  const prevTxt=prev?`\nPREVIOUS ROUND (R${prev.round}) findings to re-check, by number:\n`+(prev.findings||[]).filter(f=>f.sev!=="consider").map((f,i)=>`${i+1}. [${f.sev}] ${f.panel||""}: ${f.issue} (found "${f.found||""}", fix "${f.fix||""}")`).join("\n"):"";
  return `You are proofreading the copy on a Kitsch print/packaging file before it goes to print. Read every panel (front, back, sides, top, bottom, flaps, fine print) and check the copy only.

FILE: ${name}
${ctx}

TEXT HINTS:
${pre.text?textHints(pre.text).join("\n"):"No live text in the file: read the copy from the images."}
${prevTxt}

${PROOF_RULES}

The page images are attached (screen resolution, so very small type may be soft: rely on the extracted text below for exact wording; if you can't read something, say so in the finding and set "unsure" to true).

EXTRACTED TEXT:
${pre.text||"(none)"}

Reply with only JSON:
{"findings":[{"category":"spelling|grammar|format|awkward|ampersand","panel":"Front / Back / Side / Top / Bottom / Flap","issue":"short description","found":"the exact text as printed","fix":"the exact corrected text","why":"one line on why it matters","unsure":false}],"summary":"Quick summary: 2-4 sentences on the overall state of the copy, the most important things to fix, and whether it's ready to print","previous":[{"n":1,"status":"fixed|not_fixed|partial"}]}
Give the exact found text and exact fix for every finding. One finding per issue. Leave "previous" empty if there was no previous round.`;
}

async function runProof(rid,src){
  const r=rec(rid); if(!r||S.proofRun) return;
  const sample=await getSample();
  if(!sample){ toast("The proof check is turned off. Ask IT to add an Anthropic API key."); return; }
  const lim=await sample.limits().catch(()=>null);
  if(!lim||!lim.images){ toast("This view can't run the proof check."); return; }
  const ctl=new AbortController(); S.proofRun={rid,msg:"Reading the file…",ctl}; render();
  const name=src.file?src.file.name:src.asset.name;
  try{
    let pre;
    if(isPdf(src.file||src.asset)){
      let blob=src.file;
      if(!blob){ let res=null; try{ res=await fetch(blobUrl(src.asset)); }catch(e){} if(!res||!res.ok) throw new Error("This PDF couldn't be opened from the project. Use Upload a file instead."); blob=await res.blob(); }
      pre=await pdfPreflight(blob,Math.max(1,Math.min(4,lim.images.maxCount||4)));
    } else pre=await imagePreflight(src);
    pre.barcodes=findBarcodes(pre.text);
    if(ctl.signal.aborted) throw {code:"cancelled"};
    S.proofRun.msg="Proofreading spelling, grammar, capitalization, formatting and front-of-pack \"&\". This can take a couple of minutes…"; render();
    const prev=proofsFor(rid)[0];
    const out=await sample.json(buildProofPrompt(r,name,pre,prev),{images:pre.images.slice(0,lim.images.maxCount||4),signal:ctl.signal,modelTier:"complex"});
    let findings=(Array.isArray(out&&out.findings)?out.findings:[]).filter(f=>f&&PCAT_SEV[f.category]).slice(0,80).map(f=>({cat:f.category,sev:f.unsure?"verify":PCAT_SEV[f.category],panel:String(f.panel||"").slice(0,60),issue:String(f.issue||"").slice(0,200),found:String(f.found||"").slice(0,400),fix:String(f.fix||"").slice(0,400),why:String(f.why||"").slice(0,200),who:""}));
    const order={blocker:0,fix:1,verify:2,consider:3};
    const corder=Object.fromEntries(PCATS.map((c,i)=>[c[0],i]));
    findings=findings.sort((a,b)=>(corder[a.cat]-corder[b.cat])||(order[a.sev]-order[b.sev])).map((f,i)=>({id:"f"+(i+1),...f,status:"open"}));
    const counts=proofCounts({findings});
    const verdict=counts.blocker?"not_ready":(counts.fix||counts.verify)?"ready_after_fixes":"approved";
    const prevRes=prev&&Array.isArray(out.previous)?out.previous.map(x=>{ const pf=(prev.findings||[]).filter(f=>f.sev!=="consider")[Number(x.n)-1]; return pf&&["fixed","not_fixed","partial"].includes(x.status)?{issue:pf.issue,panel:pf.panel||"",status:x.status}:null; }).filter(Boolean):[];
    const doc={rid,round:proofsFor(rid).length+1,file:{name,id:src.asset?src.asset.id:""},at:new Date().toISOString(),by:S.me||"",verdict,summary:String(out.summary||"").replace(/^quick summary:\s*/i,"").slice(0,800),assumed:"",findings,working:[],prevResults:prevRes,
      preflight:{pdf:pre.pdf,pages:pre.totalPages,sizes:pre.pdf?pre.pages.map(p=>p.w+" × "+p.h+" in"):[],fonts:pre.fonts.map(f=>({name:f.name,embedded:f.embedded,kind:f.kind})).slice(0,20),barcodes:pre.barcodes,outlined:!!pre.outlined}};
    await saveProof(doc);
    logActivity(rid,`Print proof R${doc.round}: ${VERDICT[verdict]} (${findings.length} issue${findings.length===1?"":"s"} flagged)`);
    toast(`Proof check done: ${findings.length} issue${findings.length===1?"":"s"} flagged.`);
  }catch(e){
    const code=e&&e.code;
    toast(code==="cancelled"?"Proof check stopped.":code==="rate_limited"?"The proof check is busy. Try again in a minute.":code==="not_granted"?"The proof check wasn't allowed for this page.":code==="invalid_json"?"The proof check couldn't finish. Try again.":(e&&e.message)||"The proof check couldn't finish. Try again.");
  }finally{ S.proofRun=null; render(); }
}

async function pdSave(id,g){
  const x=pdRec(id); if(!x||!canEditPd()||S.pdSaving) return;
  const gs=g?PDS.filter(gg=>gg.g===g):PDS.filter(gg=>S.pdEdit[id+"|"+gg.g]), gk=gs.flatMap(pdGroupKeys);
  const keys=pdDirtyKeys(id).filter(k=>gk.includes(k));
  if(!keys.length){ gs.forEach(gg=>pdEndEdit(id,gg.g)); render(); return; }
  const patch={}; keys.forEach(k=>{ let v=S.pdDraft[id][k]; if(PD_KIND[k]==="bool") v=!!v; else v=String(v??"").trim(); patch[k]=v; });
  if("style" in patch && patch.style && S.pd.some(o=>o.id!==id&&String(o.style||"")===patch.style)){ toast(`Style # ${patch.style} is already used by another SKU. Check it before saving.`); }
  patch.updatedAt=new Date().toISOString(); if(S.me) patch.updatedBy=S.me;
  S.pdSaving=id; pdRefreshBar(id);
  const clear=()=>{ if(S.pdDraft[id]){ keys.forEach(k=>delete S.pdDraft[id][k]); if(!Object.keys(S.pdDraft[id]).length) delete S.pdDraft[id]; } gs.forEach(gg=>pdEndEdit(id,gg.g)); };
  if(S.mode!=="db"){ Object.assign(x,patch); persistLocalPd(); mergeSkus(); clear(); S.pdSaving=null; render(); toast("SKU saved."); return; }
  try{ await S.db.collection("pdskus").doc(id).update(patch); Object.assign(x,patch); mergeSkus(); clear(); toast(keys.length===1?"Change saved.":`${keys.length} changes saved.`); }
  catch(e){ toast(e&&e.code==="invalid_argument"?"You can view SKUs but not change them.":"The changes weren't saved. Try again."); }
  finally{ S.pdSaving=null; render(); }
}
async function pdCreate(){
  if(!canEditPd()) return;
  const id="pd_new_"+Date.now().toString(36);
  const body={status:"IN DEVELOPMENT",createdAt:new Date().toISOString(),createdBy:S.me||"",source:"Added in workspace",row:Math.max(0,...S.pd.map(x=>Number(x.row)||0))+1};
  if(S.mode!=="db"){ S.pd.push({id,...body}); persistLocalPd(); }
  else { try{ await S.db.collection("pdskus").doc(id).set(body); if(!pdRec(id)) S.pd.push({id,...body}); }catch(e){ toast("The SKU wasn't added. Try again."); return; } }
  S.pdOpen["Product details"]=true; S.pdEdit[id+"|Product details"]=true; location.hash="sku/"+id; render(); setTimeout(()=>{ const f=$('[data-pdf][data-k="style"]'); if(f) f.focus(); },60);
}

const VF=[["Company",[["name","Vendor name","text"],["aliases","Also listed as (comma separated)","text"],["status","Status","vstatus"],["type","Vendor type","vtype"],["categories","Categories / products made","text"],["country","Country","text"],["address","Address","long"],["website","Website","url"]]],
 ["Contact",[["contact","Main contact","text"],["email","Email","text"],["phone","Phone / WhatsApp","text"],["contact2","Second contact","text"]]],
 ["Terms",[["terms","Payment terms","text"],["incoterms","Incoterms","text"],["leadTime","Lead time","text"],["moq","MOQ","text"],["currency","Currency","text"]]],
 ["Compliance",[["audit","Factory audit / certifications","long"],["auditDate","Last audit date","text"]]],
 ["Notes",[["notes","Notes","long"],["link","Shared drive folder","url"]]]];
const VSTATUS=["Active","Onboarding","On hold","Inactive"], VTYPE=["Manufacturer","Filler / formulator","Packaging","Components","Agent / trading company","Other"];

S.vendors=[]; S.vendLoaded=false; S.vendQ=""; S.vendDraft={}; S.vendEdit={};
function startVendors(){

  try{ S.db.collection("vendors").onSnapshot(snap=>{ S.vendors=snap.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))})); S.vendLoaded=true; if(S.route==="vendors") scheduleRender(); },()=>{ S.vendLoaded=true; }); }catch(e){ S.vendLoaded=true; }

function vRec(id){ return S.vendors.find(v=>v.id===id); }
function vVal(v,k){ const d=S.vendDraft[v.id]; return d&&(k in d)?d[k]:v[k]; }
function vTokens(s){ return String(s||"").split(/\s*[\/,&]\s*|\s+-\s+/).map(t=>t.trim().toLowerCase()).filter(Boolean); }
function vAliases(v){ return [v.name,...String(v.aliases||"").split(",")].map(t=>String(t||"").trim().toLowerCase()).filter(Boolean); }
function vendorSkus(v){ const al=vAliases(v); return S.skus.filter(x=>{ const raw=String(x.vendor||"").toLowerCase(); return raw && (vTokens(x.vendor).some(t=>al.includes(t)) || al.includes(raw)); }).sort((a,b)=>(a.rowOrder??99999)-(b.rowOrder??99999)); }
function vendorReqs(v){ const ids=new Set(vendorSkus(v).map(x=>x.id)), codes=new Set(vendorSkus(v).map(x=>String(x.sku))); return S.records.filter(r=>(Array.isArray(r.skuIds)&&r.skuIds.some(i=>ids.has(i)))||(r.sku&&codes.has(String(r.sku)))).sort((a,b)=>(Number(b.number)||0)-(Number(a.number)||0)); }
function vChip(s){ if(!s) return ""; const c=VSTATUS_C[s]; return `<span class="chip${c?" c-"+c:""}">${esc(s)}</span>`; }
function vDirty(id,keys){ const d=S.vendDraft[id], v=vRec(id); if(!d||!v) return []; return Object.keys(d).filter(k=>(!keys||keys.includes(k))&&String(d[k]??"")!==String(v[k]??"")); }
function vFieldHtml(v,[k,l,kind],ed){
  const val=vVal(v,k);
  if(!ed){ if(!val) return `<span class="val zero">—</span>`; if(kind==="vstatus") return vChip(val); if(kind==="url"){ const u=safeUrl(val); return u?`<a class="openlink" href="${esc(u)}" target="_blank" rel="noopener">${esc(val)}</a>`:`<span class="val">${esc(val)}</span>`; } if(k==="email") return `<a class="openlink" href="mailto:${esc(val)}">${esc(val)}</a>`; return `<span class="val${kind==="long"?" long":""}">${esc(val)}</span>`; }
  const ch=vDirty(v.id,[k]).length?" changed":"", d=`data-vf data-id="${esc(v.id)}" data-k="${k}" aria-label="${esc(l)}"`;
  if(kind==="vstatus"||kind==="vtype"){ const o=kind==="vstatus"?VSTATUS:VTYPE; const all=val&&!o.includes(val)?[...o,val]:o; return `<select class="pdsel${ch}" ${d}><option value="">—</option>${all.map(x=>`<option${x===val?" selected":""}>${esc(x)}</option>`).join("")}</select>`; }
  if(kind==="long") return `<textarea class="fi${ch}" ${d} rows="3" placeholder="Add ${esc(l.toLowerCase())}">${esc(val||"")}</textarea>`;
  return `<input class="fi${ch}"${kind==="url"?' type="url"':""} ${d} value="${esc(val||"")}" placeholder="${kind==="url"?"https://…":"Add "+esc(l.toLowerCase())}">`;
}
function vGroupHtml(v,[g,fs]){
  const keys=fs.map(f=>f[0]), ek=v.id+"|"+g, ed=canEditPd()&&!!S.vendEdit[ek], n=vDirty(v.id,keys).length;

  return `<details class="pdgrp${ed?" editing":""}" open><summary><span>${esc(g)}</span>${ed?'<span class="pdeditchip">Editing</span>':""}<span class="pdcount">${fs.filter(f=>vVal(v,f[0])).length} of ${fs.length} filled</span></summary>${act}<div class="fields">${fs.map(f=>`<div class="fl">${esc(f[1])}</div><div class="fv">${vFieldHtml(v,f,ed)}</div>`).join("")}</div></details>`;

async function vSave(id,g){
  const v=vRec(id); if(!v||!canEditPd()) return;
  const keys=(VF.find(x=>x[0]===g)||[0,[]])[1].map(f=>f[0]), dk=vDirty(id,keys);
  const done=()=>{ delete S.vendEdit[id+"|"+g]; if(S.vendDraft[id]){ keys.forEach(k=>delete S.vendDraft[id][k]); if(!Object.keys(S.vendDraft[id]).length) delete S.vendDraft[id]; } };
  if(!dk.length){ done(); render(); return; }
  const patch={}; dk.forEach(k=>patch[k]=String(S.vendDraft[id][k]??"").trim()); patch.updatedAt=new Date().toISOString(); if(S.me) patch.updatedBy=S.me;
  if(S.mode!=="db"){ Object.assign(v,patch); try{ localStorage.setItem("dam-vendors-v1",JSON.stringify(S.vendors)); }catch(e){} done(); render(); toast("Vendor saved."); return; }
  try{ await S.db.collection("vendors").doc(id).update(patch); Object.assign(v,patch); done(); toast(dk.length===1?"Change saved.":`${dk.length} changes saved.`); }
  catch(e){ toast(e&&e.code==="invalid_argument"?"You can view vendors but not change them.":"The changes weren't saved. Try again."); }
  render();
}

});
document.addEventListener("dragover",e=>{ if(S.route==="render"&&e.dataTransfer&&[...e.dataTransfer.types].includes("Files")){ e.preventDefault(); const d=$(".rdrop"); if(d) d.classList.add("over"); } });
document.addEventListener("dragleave",e=>{ if(!e.relatedTarget){ const d=$(".rdrop"); if(d) d.classList.remove("over"); } });
document.addEventListener("drop",e=>{ if(S.route!=="render") return; const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(!f) return; e.preventDefault(); openUpload(f); });


/* ---------- events ---------- */
document.addEventListener("click", async e=>{
  const pop=$("#pop"); if(pop && !pop.contains(e.target) && !e.target.closest("[data-act=filter],[data-act=sort],[data-act=chartmenu],[data-act=notif],[data-act=skufilter],[data-act=skusort],[data-act=catfilter],[data-act=psort],[data-act=assetupload],[data-act=umenu],[data-act=pdfilter],[data-act=pdsort]")) closePop();
  const t=e.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act;
  if(a==="overlay"){ if(e.target===t) closeLayer(); return; }
  if(t.tagName==="SELECT") return;
  switch(a){
    case "menu": $("#app").classList.add("open"); break;
    case "close": closeLayer(); break;
    case "sendmsg": sendMsg(t.dataset.id); break;
    case "skuchiprm": comboSel=comboSel.filter(v=>v!==t.dataset.v); renderSkuChips(); break;
    case "assign": if(S.urole==="Project manager") assignRequest(t.dataset.id); break;
    case "assettab": S.assetTab=t.dataset.t; try{ localStorage.setItem("dam-asset-tab",S.assetTab); }catch(e){} render(); break;
    case "tmplup": uploadTemplates(t.dataset.k); break;
    case "tmpllink": if(!canAddCreative()) break; if($("#pop .lpop")){ closePop(); break; } openLinkPop(t.dataset.k,""); break;
    case "tmpllinksave": saveTemplateLink(t.dataset.k); break;
    case "tmpladdopen": if(!canAddCreative()) break; openAddTemplate(t.dataset.k); break;
    case "tmpladd": submitTemplate(t); break;
    case "tmplrm": { if(!canAddCreative()) break;
      if(t.dataset.armed!=="1"){ t.dataset.armed="1"; t.textContent="Click again to remove"; setTimeout(()=>{ if(document.contains(t)){ t.dataset.armed=""; t.textContent="Remove"; } },4000); break; }
      removeTemplate(t.dataset.id); break; }
    case "umenu": { if($("#pop .upop")){ closePop(); break; } openPop(t, userPop()); break; }
    case "setrole": { if(S.mode==="db" && !(S.isAdmin||S.isSubAdmin)){ closePop(); break; } S.urole=t.dataset.r; try{ localStorage.setItem("dam-user-role",S.urole); }catch(e){} closePop(); applyTeamName(); render(); toast(`Switched to ${roleLabel(S.urole)}.`); break; }
    case "psort": { if($("#pop .psortpop")) { closePop(); break; } openPop(t, psortPop(t.dataset.v)); break; }
    case "setpsort": { const v=S.views[t.dataset.v]; if(v){ const k=t.dataset.k; if(!k) v.sort={k:"number",d:"asc"}; else if(v.sort.k===k) v.sort={k,d:v.sort.d==="asc"?"desc":"asc"}; else v.sort={k,d:"asc"}; } closePop(); render(); break; }
    case "ptab": { const v=S.views[t.dataset.v]; if(v){ v.tab=t.dataset.t; render(); } break; }
    case "catfilter": { if($("#pop .catpop")) { closePop(); break; } openPop(t, catFilterPop(t.dataset.v)); break; }
    case "setwho": { const v=S.views[t.dataset.v]; if(v){ v.f={...v.f,who:t.dataset.c}; } closePop(); render(); break; }
    case "setcat": { const v=S.views[t.dataset.v]; if(v){ v.f={...v.f,brand:t.dataset.c}; } closePop(); render(); break; }
    case "skunew": closePop(); break;
    case "skufilter": openPop(t, skuFilterPop()); break;
    case "skusort": openPop(t, skuSortPop()); break;
    case "skuclear": S.skuView.f={}; S.skuView.q=""; closePop(); render(); break;
    case "skuimg": if(canEditSku()) pickSkuImage(t.dataset.id); break;
    case "skuimgrm": if(canEditSku()) saveSku(t.dataset.id,{image:null}); break;
    case "skuunlink": { const x=skuRec(t.dataset.id); if(x&&canEditSku()) saveSku(x.id,{projectIds:(x.projectIds||[]).filter(i=>i!==t.dataset.pid)}); break; }
    case "skudel": {
      if(t.dataset.armed!=="1"){ t.dataset.armed="1"; t.textContent="Click again to delete for good"; setTimeout(()=>{ if(document.contains(t)){ t.dataset.armed=""; t.textContent="Delete SKU"; } },4000); break; }
      try{ await deleteSku(t.dataset.id); location.hash="sku"; toast("SKU deleted."); render(); }catch(err){ toast("The SKU wasn't deleted."); }
      break; }
    case "notif": { if($("#pop .notifpop")) { closePop(); break; } S.notifFull=false; openPop(t, notifPopHtml()); break; }
    case "notifmarkall": { markSeen(); toast("All notifications marked as read."); break; }
    case "notifmore": { S.notifFull=true; if(S.mode==="db" && (S.actLimit||30)<200) subActivity(200); refreshNotifPop(); break; }
    case "notifless": { S.notifFull=false; refreshNotifPop(); break; }
    case "notifopen": { if(t.dataset.aid){ S.notifRead.add(t.dataset.aid); saveNotifRead(); updateBell(); } closePop(); if(rec(t.dataset.id)) openRecord(t.dataset.id, S.records); else toast("That project was deleted."); break; }
    case "prodimg": if(canEditSku()) pickProductImage(t.dataset.id); break;
    case "prodimgrm": if(!canEditSku()) break; saveField(t.dataset.id,{productImage:null}); toast("Product image removed."); break;
    case "viewfile": e.preventDefault(); openViewer(t.dataset.id,t.dataset.i,t.dataset.k); break;
    case "vclose": closeViewer(); break;
    case "vnav": viewerStep(Number(t.dataset.d)); break;
    case "sendfc": sendFC(); break;
    case "clearpin": fvPending=null; renderPinBar(); renderPins(); break;
    case "pinjump": flashMsg(t.dataset.n); flashPin(t.dataset.n); break;
    case "pinfocus": flashPin(t.dataset.n); break;
    case "linkreq": { openPop(t, linkPop(t.dataset.id)); const li=$("#reqSearch"); if(li){ li.focus(); runReqSearch(t.dataset.id,""); } break; }
    case "pickreq": { saveField(t.dataset.id,{requestorId:t.dataset.uid}); closePop(); toast("Requestor account linked."); break; }
    case "ms": { const r=rec(t.dataset.id); if(!r) break; { const allow={internal:["Creative designer"],external:["Creative lead"],approval:["Requestor"],release:["Project manager","Creative designer","Creative lead"]}[t.dataset.ms]||[]; if(!allow.includes(S.urole)){ toast("Your role can't tick this box."); break; } } if(t.dataset.ms==="approval" && S.mode==="db" && (!r.requestorId || r.requestorId!==S.me)){ toast("Only the requestor can approve this."); break; } const cur=(r.milestones||{})[t.dataset.ms]; if(!cur && t.dataset.ms==="release"){ const ob=openBlockers(r.id); if(ob && t.dataset.armed!=="1"){ t.dataset.armed="1"; toast(`${ob} print proof blocker${ob===1?" is":"s are"} still open. Click again to release anyway.`); setTimeout(()=>{ if(document.contains(t)) t.dataset.armed=""; },5000); break; } if(ob) logActivity(r.id,`Released with ${ob} open print proof blocker${ob===1?"":"s"}`); } setMilestone(r.id,t.dataset.ms,cur?"":todayIso()); break; }
    case "togglehold": { const r=rec(t.dataset.id); if(!r) break; if(r.status==="On hold"){ saveField(r.id,{status:stageStatus(r)}); } else if(r.status!=="Completed") saveField(r.id,{status:"On hold"}); break; }
    case "closepop": closePop(); break;
    case "notifall": { S.notifAll=!S.notifAll; const np=$("#pop .notifpop"); if(np) np.outerHTML=notifPopHtml(); break; }
    case "fadd": { openPop(t,`<div class="folpop"><p class="pt">Add a follower</p><p class="note" style="margin:0 0 10px">Followers see this project in My Projects and get its notifications.</p><label class="search" style="height:36px">${I.search}<span class="sr">Search people</span><input id="folSearch" data-folfor="${esc(t.dataset.id)}" placeholder="Search by name…" autocomplete="off"></label><div id="folResults" class="req-results"></div></div>`); const fi=$("#folSearch"); if(fi){ fi.focus(); runFolSearch(t.dataset.id,""); } break; }
    case "fpick": { const r=rec(t.dataset.id); if(!r) break; const f=Array.isArray(r.followers)?r.followers:[]; if(!f.includes(t.dataset.uid)){ saveField(r.id,{followers:[...f,t.dataset.uid]}); logActivity(r.id,t.dataset.uid===S.me?"Started following this project":"Added a follower"); toast("Follower added."); } closePop(); break; }
    case "ffollow": { const r=rec(t.dataset.id); if(!r||!S.me) break; const f=Array.isArray(r.followers)?r.followers:[]; if(!f.includes(S.me)){ saveField(r.id,{followers:[...f,S.me]}); logActivity(r.id,"Started following this project"); toast("You're following this project."); } break; }
    case "funfollow": { const r=rec(t.dataset.id); if(!r) break; saveField(r.id,{followers:(r.followers||[]).filter(x=>x!==t.dataset.uid)}); toast(t.dataset.uid===S.me?"You've stopped following this project.":"Follower removed."); break; }
    case "open": openRecord(t.dataset.id); break;
    case "openfromlist": { const ids=($("#layer .dialog")?.dataset.ids||"").split(","); const list=ids.map(rec).filter(Boolean); openRecord(t.dataset.id,list); break; }
    case "dnav": if(t.dataset.to){ openDrawerId=t.dataset.to; $("#layer .drawer").innerHTML=drawerHtml(openDrawerId); $("#layer .drawer").scrollTop=0; const cl=$("#chatList"); if(cl) cl.scrollTop=cl.scrollHeight; } break;
    case "nav": if(t.dataset.to) location.hash=(t.dataset.pre||"sku")+"/"+t.dataset.to; break;
    case "new": if(canRequest()) openNew(); break;
    case "create": {
      const f=$("#newForm"), g=n=>f.querySelector(`[name=${n}]`).value.trim();
      if(!g("title")){ $("#titleErr").hidden=false; f.querySelector("[name=title]").focus(); return; }
      t.disabled=true;
      const pickIds=g("skuPick").split(",").filter(Boolean), skuList2=pickIds.filter(v=>v!=="__new").map(skuRec).filter(Boolean), skuX=skuList2[0]||null;
      const fileInp=f.querySelector("[name=files]"), files=fileInp?[...fileInp.files]:[];
      const extra=skuX?{sku:String(skuX.sku||""),upc:String(skuX.upc||""),hts:String(skuX.hts||""),dimensions:dimsText(skuX),styleName:skuX.styleName||""}:{};
      if(skuList2.length){ extra.skuIds=skuList2.map(x=>x.id); extra.skuCodes=skuList2.map(x=>String(x.sku||"")); }
      if(pickIds.includes("__new")) extra.notes="SKU: new / not in the SKU list yet.";
      try{ const id=await createRecord({title:g("title"),due:g("due"),type:g("type"),brand:g("brand"),requestor:g("requestor"),notes:"",description:g("description"),link:safeUrl(g("link"))?g("link"):"",...extra}); closeLayer(); toast("Request submitted."); render(); openRecord(id); if(files.length) uploadFiles(id,files,"requestAssets"); }
      catch(err){ t.disabled=false; toast(err&&err.code==="invalid_argument"?"You can view this base but not add requests.":"The request wasn't submitted. Try again."); }
      break; }
    case "toggle": { const r=rec(t.dataset.id); saveField(r.id,{[t.dataset.k]:!r[t.dataset.k]}); break; }
    case "addfile": pickFiles(t.dataset.id, t.dataset.k); break;
    case "rmatt": { const r=rec(t.dataset.id); const key=t.dataset.k==="requestAssets"?"requestAssets":"versions"; const vs=(r[key]||[]).slice(); const [gone]=vs.splice(Number(t.dataset.i),1); await saveField(r.id,{[key]:vs}); toast(`Removed ${gone?.name||"file"}.`); break; }
    case "del": {
      if(S.urole!=="Project manager"){ toast("Only project managers can delete requests."); break; }
      if(t.dataset.armed!=="1"){ t.dataset.armed="1"; t.textContent="Click again to delete for good"; setTimeout(()=>{ if(document.contains(t)){ t.dataset.armed=""; t.textContent="Delete request"; } },4000); return; }
      try{ await deleteRecord(t.dataset.id); closeLayer(); if(S.route==="sku") location.hash="sku"; toast("Request deleted."); render(); }catch(err){ toast("The request wasn't deleted."); }
      break; }
    case "filter": openPop(t, filterPop(t.dataset.v)); break;
    case "sort": openPop(t, sortPop(t.dataset.v)); break;
    case "clearfilters": S.views[t.dataset.v].f={}; closePop(); render(); break;
    case "clearview": S.views[t.dataset.v].f={}; S.views[t.dataset.v].q=""; render(); break;
    case "opensearch": (S.views[t.dataset.v]||S.views.projects).searchOpen=true; render(); $("#projSearch")?.focus(); break;
    case "chartmenu": openPop(t, chartPop()); break;
    case "chartby": S.chartBy=t.dataset.k; closePop(); render(); break;
    case "bar": barClick(t); break;
    case "cell": {
      const {rf,cf,rv,cv}=t.dataset;
      const list=S.records.filter(r=>(!rv||r[rf]===rv)&&(!cv||r[cf]===cv));
      openList([rv,cv].filter(Boolean).join(", ")||"All requests", applyView(list,{q:"",f:{},sort:{k:"number",d:"asc"}}));
      break; }
    case "pivotx": openPivot(); break;
    case "dsort": { const k=t.dataset.k; dashSort = dashSort.k===k ? {k,d:dashSort.d==="asc"?"desc":"asc"} : {k,d:"asc"}; render(); break; }
    case "kpi": { const k=kpiDefs().find(x=>x[0]===t.dataset.k); if(!k) break; openList(k[1], applyView(kpiList(k[0]),{q:"",f:{},sort:{k:"due",d:"asc"}})); break; }
    case "stat": { const s=stats(), k=t.dataset.k; if(k==="assets"){ location.hash="assets"; break; } const map={done:["Projects completed",s.done],ontime:["Projects that missed their due date",s.late],month:["Completed in the last 30 days",s.month]}; openList(map[k][0], applyView(map[k][1],{q:"",f:{},sort:{k:"due",d:"asc"}})); break; }
    case "compact": S.skuCompact=!S.skuCompact; render(); break;
    case "skumore": S.skuMore=!S.skuMore; render(); break;
    case "theme": {
      const root=document.documentElement, cur=root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
      root.dataset.theme = cur==="dark"?"light":"dark"; try{ localStorage.setItem("dam-theme-v2",root.dataset.theme); }catch(e){}
      break; }
    case "assetupload": {
      if($("#pop .uppop")){ closePop(); break; }
      openPop(t, `<div class="uppop"><p class="pt">Upload to which project?</p>${applyView(S.records,{q:"",f:{},sort:{k:"number",d:"desc"}}).map(r=>`<button class="opt" data-act="uppick" data-id="${r.id}">${esc(projNo(r))} · ${esc(r.title||"Untitled")}</button>`).join("")}</div>`); break; }
    case "uppick": closePop(); pickFiles(t.dataset.id); break;
    case "assetupload_old": {
      if(!S.assetProj){ toast("Pick a project from the list first, then upload."); $("[data-act=assetproj]")?.focus(); return; }
      pickFiles(S.assetProj); break; }
  }
});
function barClick(t){
  const k=t.dataset.k, f=S.chartBy;
  const list=S.records.filter(r=>k==="(Empty)"?!r[f]:r[f]===k);
  openList(`${GROUPABLE[f]}: ${k}`, applyView(list,{q:"",f:{},sort:{k:"number",d:"asc"}}));
}
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if($("#pop")) closePop(); else if($("#layer").innerHTML) closeLayer(); else $("#app").classList.remove("open"); return; }
  const t=e.target;
  if((e.key==="Enter"||e.key===" ") && t.matches && t.matches("rect.bar")){ e.preventDefault(); barClick(t); return; }
  if((S.route==="sku"||S.route==="vendors") && !$("#layer").innerHTML && !t.matches("input,textarea,select") && (e.key==="ArrowDown"||e.key==="ArrowUp")){
    const b=$(`[data-act=nav][aria-label^="${e.key==="ArrowUp"?"Previous":"Next"}"]`); if(b&&!b.disabled){ e.preventDefault(); b.click(); }
  }
});
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.dataset.search){
    const pos=t.selectionStart;
    if(t.dataset.search==="assets") S.assetQ=t.value; else if(t.dataset.search==="tmpl") S.tmplQ=t.value; else if(t.dataset.search==="skucat") S.skuView.q=t.value; else if(t.dataset.search==="colorq") S.colorQ=t.value; else if(t.dataset.search==="dieq") S.dieQ=t.value; else if(t.dataset.search==="help") S.helpQ=t.value; else if(t.dataset.search==="pdq") S.pdView.q=t.value; else if(t.dataset.search==="vendq") S.vendQ=t.value; else S.views[t.dataset.search].q=t.value;
    render();
    const n=document.querySelector(`[data-search="${t.dataset.search}"]`); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} }
  }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.matches("[data-field]")){
    const r=rec(t.dataset.id); if(!r) return;
    const k=t.dataset.k, val=t.value.trim();
    if((r[k]||"")!==val){
      const patch={[k]:val};
      if((k==="lead"||k==="designer") && r.status==="New request"){ const other=k==="lead"?r.designer:r.lead; if(val && other){ patch.status="In creative"; setTimeout(()=>logActivity(r.id,`Assigned to ${k==="lead"?val:other} (creative lead) and ${k==="designer"?val:other} (designer)`),0); } }
      saveField(r.id,patch);
    }
    return;
  }
  if(t.dataset.ms && t.classList.contains("ms-date")){ if(t.value){ setMilestone(t.dataset.id,t.dataset.ms,t.value); } return; }
  if(t.dataset.pf){ const v=S.views[t.dataset.v]; v.f[t.dataset.pf]=t.value; render(); return; }
  if(t.dataset.ps){ const v=S.views[t.dataset.v]; v.sort[t.dataset.ps]=t.value; render(); return; }
  if(t.dataset.act==="assettype"){ S.assetType=t.value; render(); return; }
  if(t.dataset.act==="assetproj"){ S.assetProj=t.value; render(); return; }
  if(t.dataset.act==="assetcat"){ S.assetCat=t.value; render(); return; }
  if(t.dataset.act==="pivr"||t.dataset.act==="pivc"){ pivotState[t.dataset.act==="pivr"?"r":"c"]=t.value; $("#pivotBig").innerHTML=pivotHtml(pivotState.r,pivotState.c); return; }
});
$("#scrim").addEventListener("click",()=>$("#app").classList.remove("open"));
$("#collapseBtn").addEventListener("click",()=>{ $("#app").classList.add("collapsed"); render(); });
$("#newBtn").addEventListener("click",()=>{ if(canRequest()) openNew(); });
document.addEventListener("click",e=>{ if(e.target.closest("[data-act=expandside]")) $("#app").classList.remove("collapsed"); });

/* People datalist for person fields */
function syncPeople(){ let dl=$("#peopleList"); if(!dl){ dl=document.createElement("datalist"); dl.id="peopleList"; document.body.appendChild(dl); } dl.innerHTML=names().map(n=>`<option value="${esc(n)}">`).join(""); }
const _render=render;
render=function(){ _render(); updateBell(); syncPeople(); const app=$("#app"); if(app.classList.contains("collapsed")){ const tb=$("#main .topbar .crumbs, #main .listhead > div"); if(tb && !$("#main [data-act=expandside]")) tb.insertAdjacentHTML("afterbegin",`<button class="tbtn" data-act="expandside" aria-label="Show sidebar">${I.menu}</button>`); } };

/* ---------- boot ---------- */
try{ const th=localStorage.getItem("dam-theme-v2"); document.documentElement.dataset.theme = th==="dark" ? "dark" : "light"; }catch(e){ document.documentElement.dataset.theme="light"; }
readHash(); render();
(async()=>{
  if(!window.claude || typeof window.claude.use!=="function"){ startLocal(); return; }
  let db=null;
  try{ db=await window.claude.use("db"); }catch(e){ db=null; }
  if(!db){ startLocal(); return; }
  S.db=db; S.mode="db";
  try{ const user=await window.claude.use("user"); S.user=user; const cw=user?await user.can("data.write"):null; S.canWrite = cw!==false; if(user){ S.me=await user.id(); S.isEditor=!!(await user.canEdit()); S.isOwner=!!(await user.isOwner()); user.profiles([S.me]).then(ps=>{ S.myName=(ps[S.me]&&ps[S.me].name)||""; if(S.loaded) scheduleRender(); updateUserBtns(); }).catch(()=>{}); } }catch(e){ S.canWrite=true; }
  startMembers();
  window.claude.use("assets").then(a=>{ S.assets=a; if(S.loaded) scheduleRender(); }).catch(()=>{});
  startActivity();
  db.collection("requests").onSnapshot(snap=>{
    S.records=snap.docs.map(d=>normRec({id:d.id,...JSON.parse(JSON.stringify(d.data()))}));
    S.loaded=true; scheduleRender();
  }, err=>{
    if(!S.loaded){ startLocal(); toast("Couldn't reach the shared base, showing a local copy."); }
    else toast("Live updates paused. Reload to reconnect.");
  });
})();
</script>
