<!doctype html>
<html lang="en">
<head>
<script src="/runtime.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Dashboard v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f5f6f8; --surface-3:#eceef2; --hover:#f2f3f5;
  --text:#1d1f25; --text-2:#5b6070; --text-3:#8a8f9c;
  --border:#e4e6eb; --border-strong:#cfd3da;
  --side:#ffffff; --side-active:#eaf1fd; --side-hover:#f2f3f5; --side-text:#1d1f25; --side-text-2:#5b6070; --side-line:#e4e6eb; --side-active-text:#2559b3;
  --accent:#2f6fd8; --accent-text:#ffffff; --focus:#2f6fd8;
  --bar:#5a86c6; --bar-hover:#3f6db0;
  --check:#2e8b32; --danger:#c62b2b;
  --chip:#e9ebef; --chip-t:#30343d;
  --pink:#ffd1e6; --pink-t:#6b1d3d;
  --yellow:#ffe8a6; --yellow-t:#5c4100;
  --green:#c4ecc0; --green-t:#1d4d1a;
  --lgreen:#d6f5d0; --lgreen-t:#1f4d1d;
  --blue:#bfe8fb; --blue-t:#0b4a63;
  --amber:#ffd77a; --amber-t:#5a3b00;
  --purple:#e3d7ff; --purple-t:#3d2577;
  --teal:#c6eee9; --teal-t:#0f4a43;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 6px 20px rgba(20,30,50,.10);
  --overlay:rgba(15,20,30,.38);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16181d; --surface:#1d2026; --surface-2:#23272f; --surface-3:#2b3039; --hover:#262a32;
    --text:#eceef2; --text-2:#aab0bc; --text-3:#7d8492;
    --border:#30353f; --border-strong:#434a56;
    --side:#1d2026; --side-active:#26324a; --side-hover:#262a32; --side-text:#eceef2; --side-text-2:#aab0bc; --side-line:#30353f; --side-active-text:#9fc0f7;
    --accent:#5b8ff0; --accent-text:#0d1320; --focus:#7aa6f5;
    --bar:#6b95d6; --bar-hover:#8aaee6;
    --check:#5bc160; --danger:#ff7676;
    --chip:#323844; --chip-t:#dfe3ea;
    --pink:#5a2741; --pink-t:#ffd6e8;
    --yellow:#594a1c; --yellow-t:#ffeab0;
    --green:#24502a; --green-t:#cdf0c8;
    --lgreen:#2b4a2a; --lgreen-t:#d6f5d0;
    --blue:#1b4a60; --blue-t:#c8ecfb;
    --amber:#5f4813; --amber-t:#ffe1a0;
    --purple:#3c2f66; --purple-t:#e3d7ff;
    --teal:#1b4a45; --teal-t:#c6eee9;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);
    --overlay:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16181d; --surface:#1d2026; --surface-2:#23272f; --surface-3:#2b3039; --hover:#262a32;
  --text:#eceef2; --text-2:#aab0bc; --text-3:#7d8492;
  --border:#30353f; --border-strong:#434a56;
  --side:#1d2026; --side-active:#26324a; --side-hover:#262a32; --side-text:#eceef2; --side-text-2:#aab0bc; --side-line:#30353f; --side-active-text:#9fc0f7;
  --accent:#5b8ff0; --accent-text:#0d1320; --focus:#7aa6f5;
  --bar:#6b95d6; --bar-hover:#8aaee6;
  --check:#5bc160; --danger:#ff7676;
  --chip:#323844; --chip-t:#dfe3ea;
  --pink:#5a2741; --pink-t:#ffd6e8;
  --yellow:#594a1c; --yellow-t:#ffeab0;
  --green:#24502a; --green-t:#cdf0c8;
  --lgreen:#2b4a2a; --lgreen-t:#d6f5d0;
  --blue:#1b4a60; --blue-t:#c8ecfb;
  --amber:#5f4813; --amber-t:#ffe1a0;
  --purple:#3c2f66; --purple-t:#e3d7ff;
  --teal:#1b4a45; --teal-t:#c6eee9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);
  --overlay:rgba(0,0,0,.55);
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
img{max-width:100%}
.scrim{display:none}
.app{display:grid;grid-template-columns:240px 1fr;height:100%}
.app.collapsed{grid-template-columns:0 1fr}
.app.collapsed .side{visibility:hidden}

/* Sidebar */
.side{border-right:1px solid var(--side-line);background:var(--side);color:var(--side-text);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.brand{display:flex;gap:10px;align-items:flex-start;padding:22px 18px 18px}
.brand svg{flex:none;margin-top:4px;color:var(--accent)}
.brand h1{font-size:17px;line-height:1.3;margin:0;font-weight:650}
.nav{display:flex;flex-direction:column;gap:2px;padding:4px 10px}
.nav a{color:var(--side-text-2);text-decoration:none;padding:7px 12px;border-radius:6px;font-size:14px}
.nav a:hover{background:var(--side-hover);color:var(--side-text)}
.nav a[aria-current="page"]{background:var(--side-active);color:var(--side-active-text);font-weight:600}
.side-new{margin:14px 20px 0;display:flex;align-items:center;gap:6px;color:var(--side-text);padding:7px 12px;border-radius:6px;border:1px solid var(--side-line);font-weight:550;font-size:13px;width:max-content}
.side-new:hover{background:var(--side-hover)}
.side-foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--side-line);display:flex;align-items:center;gap:10px;font-size:12px;color:var(--side-text-2)}
.side-foot .grow{flex:1;min-width:0}
.side-foot button{color:var(--side-text);padding:6px;border-radius:6px}
.side-foot button:hover{background:var(--side-hover)}

/* Main */
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 24px;border-bottom:1px solid var(--border);flex:none}
.crumbs{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--text-2);min-width:0}
.crumbs b{color:var(--text);font-weight:600;white-space:nowrap}
.crumbs svg{color:var(--text-3)}
.topbar .tools{margin-left:auto;display:flex;gap:4px;align-items:center}
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;color:var(--text);font-size:14px}
.tbtn:hover{background:var(--hover)}
.tbtn .badge{background:var(--accent);color:var(--accent-text);border-radius:10px;font-size:11px;padding:0 6px;font-weight:600}
.menu-btn{display:none}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.page{padding:28px 32px 48px;max-width:1500px}

/* Chips */
.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;background:var(--chip);color:var(--chip-t);font-size:13px;line-height:20px;white-space:nowrap}
.c-purple{background:var(--purple);color:var(--purple-t)}.c-teal{background:var(--teal);color:var(--teal-t)}
.c-pink{background:var(--pink);color:var(--pink-t)}.c-yellow{background:var(--yellow);color:var(--yellow-t)}.c-green{background:var(--green);color:var(--green-t)}.c-lgreen{background:var(--lgreen);color:var(--lgreen-t)}.c-blue{background:var(--blue);color:var(--blue-t)}.c-amber{background:var(--amber);color:var(--amber-t)}
.person{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 4px;border:1px solid var(--border);border-radius:999px;font-size:13px;color:var(--text-2)}
.person i{width:18px;height:18px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:var(--text-2)}
.empty-pill{display:inline-block;width:22px;height:6px;border-radius:4px;background:var(--surface-3);vertical-align:middle}
.ck{color:var(--check)}

/* Dashboard */
.h-req{display:flex;align-items:center;gap:12px;font-size:34px;font-weight:600;letter-spacing:-.01em;margin:0 0 22px}
.newtag{font-size:11px;font-weight:800;color:#fff;background:linear-gradient(#7d93b5,#5a7196);border-radius:7px;padding:8px 6px;letter-spacing:.02em;line-height:1}
.panel{border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-bottom:16px;position:relative}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpis .panel{margin:0}
.kpis .count{display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start}
.kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat-h{font-size:16px;font-weight:600;margin:28px 0 12px}
@media (max-width:1100px){.kpis.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.count .num small{font-size:24px;font-weight:500;color:var(--text-2);margin-left:2px}
.count{padding:20px 24px;text-align:left;width:100%;display:block}
button.count:hover{border-color:var(--border-strong);background:var(--hover)}
.count .hint{font-size:12.5px;color:var(--text-3);margin-top:4px}
@media (max-width:700px){.kpis,.kpis.four{grid-template-columns:1fr}}
.count .lbl{font-size:15px;color:var(--text-2)}
.count .num{font-size:48px;font-weight:500;line-height:1.05}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 0 24px}
.panel-head h2{font-size:16px;font-weight:600;margin:0}
.panel-head .sub{font-size:13px;color:var(--text-2)}
.ibtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--border);border-radius:8px;color:var(--text-2);background:var(--surface)}
.ibtn:hover{background:var(--hover);color:var(--text)}
.chart-wrap{padding:8px 16px 12px 8px}
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--bar);cursor:pointer;transition:fill .12s}
.chart .bar:hover,.chart .bar:focus{fill:var(--bar-hover);outline:none}
.chart text{fill:var(--text-2);font-size:13px}
.chart .grid{stroke:var(--border)}
.pivot-wrap{overflow-x:auto;padding:4px 0 6px}
table.stable{border-collapse:collapse;width:100%;min-width:640px}
.stable th,.stable td{padding:12px 24px;border-bottom:1px solid var(--border);text-align:left;font-weight:400;vertical-align:middle}
.stable thead th{border-bottom:1px solid var(--border-strong);padding-top:16px;padding-bottom:10px}
.stable tbody tr:last-child td{border-bottom:0}
.stable tbody tr:hover{background:var(--hover)}
.thbtn{font-weight:550;color:var(--text-2);display:inline-flex;gap:4px;align-items:center}
.thbtn:hover{color:var(--text)}
.sarrow{color:var(--accent);width:10px}
.rowlink{font-weight:550;text-align:left;color:var(--text)}
.rowlink:hover{color:var(--accent);text-decoration:underline}
.nowrap{white-space:nowrap;font-variant-numeric:tabular-nums}
table.pivot{border-collapse:collapse;width:100%;min-width:640px;font-variant-numeric:tabular-nums}
.pivot th,.pivot td{padding:14px 24px;border-bottom:1px solid var(--border);text-align:right;font-weight:400}
.pivot thead th{border-bottom:1px solid var(--border-strong);padding-top:18px}
.pivot th:first-child,.pivot td:first-child{text-align:left}
.pivot tbody td+td,.pivot tfoot td+td{border-left:1px solid var(--border)}
.pivot tbody td:first-child{border-right:1px solid var(--border)}
.pivot thead th:first-child{color:var(--text);font-weight:500}
.pivot .tot{font-weight:650}
.pivot tfoot td{font-weight:650}
.pivot thead th .chip{margin-left:auto}
.cellbtn{font-variant-numeric:tabular-nums;padding:2px 6px;border-radius:5px;margin:-2px -6px}
.cellbtn:hover{background:var(--hover);text-decoration:underline}
.zero{color:var(--text-2)}

/* Gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{display:flex;flex-direction:column;text-align:left;border:1px solid var(--border);border-radius:8px;background:var(--surface);overflow:hidden;transition:box-shadow .15s}
.card:hover{box-shadow:var(--shadow)}
.thumb{height:200px;display:grid;place-items:center;background:var(--surface);color:var(--border-strong);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.card .body{padding:14px 22px 22px;display:flex;flex-direction:column;gap:14px;flex:1}
.card h3{margin:0;font-size:17px;font-weight:600;line-height:1.3;min-height:2.6em}
.card .row{min-height:22px;display:flex;align-items:center;font-size:14px}
.card .pnum{font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums;margin-bottom:-8px}
.card .cmeta{margin:2px 0 0;padding-top:12px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;min-height:34px}
.card .ccat{color:var(--text-2)}
.card .cmeta div{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card .cmeta dt{color:var(--text-2)}
.card .cmeta dd{margin:0;text-align:right}
.empty{padding:60px 20px;text-align:center;color:var(--text-2)}
.empty h3{color:var(--text);font-size:16px;margin:0 0 6px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:7px;background:var(--accent);color:var(--accent-text);font-weight:600;font-size:14px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border-strong)}
.btn.ghost:hover{background:var(--hover);filter:none}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--border-strong)}
.btn[disabled]{opacity:.55;cursor:default}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:8px;padding:0 12px;height:40px;color:var(--text-3)}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;color:var(--text);height:100%}
.search input::placeholder{color:var(--text-3)}
.top-search{width:220px;height:34px}

/* SKU split */
.split{display:grid;grid-template-columns:minmax(300px,420px) 1fr;height:100%;min-height:0}
.listpane{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.listhead{padding:20px 24px 12px}
.listhead .ttl{font-size:20px;font-weight:600;margin:0 0 14px}
.listtools{display:flex;justify-content:flex-end;gap:2px;margin-bottom:10px}
.listtools .tbtn{padding:6px 8px;color:var(--text-2)}
.listtools .tbtn.on{color:var(--accent)}
.list{overflow:auto;flex:1;border-top:1px solid var(--border)}
.li{display:flex;gap:20px;align-items:center;width:100%;text-align:left;padding:18px 24px;border-bottom:1px solid var(--border)}
.li:hover{background:var(--hover)}
.li[aria-current="true"]{background:var(--surface-3)}
.li .lt{width:96px;height:84px;border-radius:8px;background:var(--surface-2);flex:none;overflow:hidden}
.li .lt img{width:100%;height:100%;object-fit:cover}
.li.compact .lt{display:none}
.li .ln{font-size:15px;font-weight:500;margin-bottom:4px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.li .lb{min-width:0}
.li .lsub{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail{overflow:auto;min-height:0}
.detail-inner{padding:24px 56px 60px 64px;max-width:1300px}
.dnav{display:flex;gap:10px;margin-bottom:48px;align-items:center}
.dnav .ibtn{border:0}
.dnav .ibtn[disabled]{opacity:.35;cursor:default}
.back-btn{display:none}
.dtitle{font-size:clamp(26px,3.2vw,40px);font-weight:600;line-height:1.15;margin:0 0 26px;letter-spacing:-.01em;padding-bottom:28px;border-bottom:1px solid var(--border)}

/* Fields */
.fields{display:grid;grid-template-columns:200px minmax(0,1fr);column-gap:28px;row-gap:16px;align-items:start}
.fields .fl{font-weight:500;padding-top:6px;font-size:15px}
.fields .fv{min-height:32px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:15px}
.fv .val{padding:4px 0}
.fv .val.long{white-space:pre-wrap;line-height:1.55;max-width:70ch}
.fi{width:100%;max-width:560px;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;margin-left:-8px;outline:none}
.fi:hover{border-color:var(--border)}
.fi:focus{border-color:var(--focus);background:var(--surface)}
textarea.fi{resize:vertical;min-height:70px;line-height:1.55;max-width:70ch}
input[type=date].fi{max-width:200px}
.chipsel{position:relative;display:inline-flex;align-items:center;gap:4px;border-radius:999px}
.chipsel select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.chipsel .caret{color:var(--text-3)}
.chipsel:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.ckbtn{width:26px;height:26px;border:1.5px solid var(--border-strong);border-radius:6px;display:grid;place-items:center;color:var(--check)}
.ckbtn.on{border-color:transparent}
.ckbtn:hover{background:var(--hover)}
.fields .full{grid-column:1/-1}
.fields .fl.full{padding-top:0;margin-bottom:-6px}
.fields .fv.full{margin-bottom:8px}
.attach{width:100%;border-radius:8px;background:var(--surface-2);padding:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;min-height:86px}
.attach .none{flex:1;text-align:center;color:var(--text-2)}
.att{position:relative;width:110px;border-radius:8px;border:1px solid var(--border);background:var(--surface);overflow:hidden}
.att a{display:block;color:inherit;text-decoration:none}
.att .ap{height:80px;display:grid;place-items:center;background:var(--surface-3);color:var(--text-2);font-size:12px;font-weight:700}
.att .ap img{width:100%;height:100%;object-fit:cover}
.att .an{font-size:11.5px;padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.att .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:var(--overlay);color:#fff;display:grid;place-items:center;opacity:0}
.att:hover .rm,.att .rm:focus{opacity:1}
.addfile{width:110px;height:108px;border:1.5px dashed var(--border-strong);border-radius:8px;display:grid;place-items:center;color:var(--text-2);font-size:12.5px;text-align:center}
.addfile:hover{background:var(--hover);color:var(--text)}
.morebtn{margin-top:24px;color:var(--accent);font-weight:550}
.chat{margin-top:22px;padding-top:0}
.after-chat{margin-top:28px;padding-top:24px;border-top:1px solid var(--border)}
.chat h3{font-size:16px;font-weight:600;margin:0 0 12px}
.chat-list{height:240px;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);padding:6px 4px}
.chat-empty{color:var(--text-2);font-size:13.5px;margin:14px 12px}
.msgs{list-style:none;margin:0;padding:0}
.msg{display:flex;gap:10px;padding:10px 12px;border-radius:8px}
.msg:hover{background:var(--hover)}
.msg .av{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface-3);color:var(--text-2);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}
.msg.mine .av{background:var(--accent);color:var(--accent-text)}
.msg .mb{min-width:0;flex:1}
.msg .mh{display:flex;align-items:baseline;gap:8px;font-size:13px}
.msg .mh time{color:var(--text-3);font-size:12px}
.msg p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.mdel{margin-left:auto;color:var(--text-3);opacity:0;padding:2px;border-radius:4px}
.msg:hover .mdel,.mdel:focus{opacity:1}
.mdel:hover{color:var(--danger)}
.composer{position:relative;display:flex;gap:10px;align-items:flex-end;margin-top:10px}
.chat-in{flex:1;min-width:0;border:1px solid var(--border-strong);border-radius:8px;padding:9px 11px;background:var(--surface);resize:vertical;min-height:44px;line-height:1.45;outline:none}
.chat-in:focus{border-color:var(--focus)}
.attbtn{flex:none;width:40px;height:40px;border:0;background:var(--surface-2)}
.attpend{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.attpend:empty{display:none}
.attchip{display:inline-flex;align-items:center;gap:6px;max-width:240px;font-size:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px 6px 3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attchip.busy{color:var(--text-3);padding-right:10px}
.attchip button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);font-size:14px;line-height:1}
.attchip button:hover{background:var(--hover);color:var(--text)}
.matt{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.matt-img{display:block;width:140px;height:100px;border-radius:10px;overflow:hidden;background:var(--surface-3);cursor:zoom-in}
.matt-img img{width:100%;height:100%;object-fit:cover}
.matt-file{display:flex;align-items:center;gap:8px;max-width:240px;padding:6px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);text-decoration:none;font-size:12.5px}
.matt-file b{font-size:10.5px;background:var(--tile1);border-radius:6px;padding:2px 6px}
.matt-file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mentpop{position:absolute;left:0;bottom:calc(100% + 6px);z-index:30;min-width:220px;max-width:320px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:4px}
.mentopt{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px}
.mentopt.on,.mentopt:hover{background:var(--hover)}
.ment{font-weight:600;color:var(--text);background:var(--tile1);border-radius:4px;padding:0 3px}
.ment.me{background:#C0392B;color:#fff}
.timeline{margin-top:28px}
.tl-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.tl-head h3{font-size:16px;font-weight:600;margin:0}
.ms-list{list-style:none;margin:0;padding:0;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.ms-box{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface)}
.ms-box+.ms-box{border-top:1px solid var(--border)}
.ms-box.done{background:var(--surface-2)}
.ms-check{flex:none;width:26px;height:26px;border:1.5px solid var(--border-strong);border-radius:7px;display:grid;place-items:center;color:var(--accent-text);background:var(--surface)}
.ms-check svg{width:16px;height:16px}
.ms-check.on{background:var(--check);border-color:var(--check)}
button.ms-check:hover{border-color:var(--check)}
span.ms-check:not(.on){opacity:.45;background:var(--surface-3)}
.ms-txt{flex:1;min-width:0}
.ms-t{font-weight:550}
.ms-box.done .ms-t{color:var(--text)}
.ms-s{font-size:12.5px;color:var(--text-2);margin-top:1px}
.ms-link{color:var(--accent);font-weight:550;font-size:12.5px;margin-left:4px}
.ms-link:hover{text-decoration:underline}
.req-results{margin-top:8px;max-height:240px;overflow:auto}
.ms-pending{font-size:13px;color:var(--text-3)}
.ms-dv{font-size:13.5px;font-variant-numeric:tabular-nums}
.ms-date{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:4px 8px;font-size:13.5px;outline:none}
.ms-date:focus{border-color:var(--focus)}
.tl-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:14px;flex-wrap:wrap}
.tl-foot .late{color:var(--danger);font-weight:550}
.holdbtn{padding:6px 12px;font-size:13px}
@media (max-width:560px){ .ms-box{flex-wrap:wrap} .ms-dl,.ms-pending,.ms-dv{margin-left:40px} }
.danger-zone{margin-top:40px;padding-top:20px;border-top:1px solid var(--border)}

/* Assets page */
.assets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.acard{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);text-align:left;display:flex;flex-direction:column}
.acard .ap{height:150px;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2);font-weight:700}
.acard .ap img{width:100%;height:100%;object-fit:cover}
.acard .ab{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.acard .an{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .apj{font-size:13px;color:var(--accent);text-align:left}
.acard .apj:hover{text-decoration:underline}
.bar-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.sel{height:36px;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface);padding:0 10px}

/* Overlay / modal / popover */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;justify-content:flex-end;z-index:40}
.overlay.center{justify-content:center;align-items:center;padding:20px}
.drawer{width:min(760px,100%);height:100%;background:var(--surface);box-shadow:var(--shadow);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.dialog{width:min(640px,100%);max-height:100%;overflow:auto;background:var(--surface);border-radius:12px;box-shadow:var(--shadow)}
.dialog.wide{width:min(1100px,100%)}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.dhead h2{font-size:16px;margin:0;font-weight:600;flex:1;min-width:0}
.dbody{padding:22px 28px 28px}
.drawer .dbody{padding:26px 36px 48px}
.drawer .dtitle{font-size:28px;margin-bottom:22px;padding-bottom:20px}
.dsum{display:flex;flex-wrap:wrap;gap:12px 36px;margin:16px 0 0;font-size:14px;font-weight:400;letter-spacing:0}
.dsum dt{color:var(--text-2);font-size:12.5px;margin-bottom:4px}
.dsum dd{margin:0;min-height:26px;display:flex;align-items:center;font-variant-numeric:tabular-nums}
.rlist{display:flex;flex-direction:column}
.rrow{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--border);text-align:left;width:100%}
.rrow:hover{background:var(--hover)}
.rrow .rn{flex:1;font-weight:500}
.rrow .rd{color:var(--text-2);font-size:13px;width:90px;text-align:right}
.form{display:grid;gap:16px}
.form label{display:grid;gap:6px;font-weight:550;font-size:14px}
.form .in{border:1px solid var(--border-strong);border-radius:7px;padding:8px 10px;background:var(--surface);width:100%}
.form textarea.in{min-height:80px;resize:vertical}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form .hint{font-size:12px;font-weight:400;color:var(--text-2)}
.form .err{color:var(--danger);font-size:13px;font-weight:400}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:14px;min-width:240px;max-width:calc(100vw - 20px)}
.pop .pr{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;margin-bottom:10px;font-size:13.5px}
.pop .pt{font-weight:600;margin:0 0 12px;font-size:14px}
.pop .pf{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.pop .opt{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:6px}
.pop .opt:hover{background:var(--hover)}
.pop .opt[aria-checked="true"]{font-weight:600;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.loading{padding:60px;color:var(--text-2)}
.note{font-size:12.5px;color:var(--text-2);margin:-8px 0 18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:860px){
  .app,.app.collapsed{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:45;transform:translateX(-100%);transition:transform .2s;visibility:visible!important;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .app.open .side{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:var(--overlay);z-index:44}
  .menu-btn{display:inline-flex}
  .collapse-btn{display:none}
  .topbar{padding:10px 14px}
  .page{padding:20px 16px 40px}
  .top-search{width:150px}
  .split{grid-template-columns:1fr}
  .split.has-sel .listpane{display:none}
  .split:not(.has-sel) .detail{display:none}
  .back-btn{display:inline-flex}
  .detail-inner{padding:16px 18px 40px}
  .dnav{margin-bottom:22px}
  .fields{grid-template-columns:1fr;row-gap:4px}
  .fields .fv{margin-bottom:12px}
  .drawer .dbody{padding:20px 18px 40px}
  .form .two{grid-template-columns:1fr}
  .h-req{font-size:28px}
}


/* ================= Product Hub look ================= */
.nav-label{display:none}
:root{
  --serif:"Tiempos Headline","Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Neue Haas Grotesk Display Pro","Neue Haas Grotesk Text Pro","Helvetica Neue",Helvetica,Arial,sans-serif;
  --bg:#F4EFE8; --surface:#FFFCF8; --surface-2:#F7F1EA; --surface-3:#EFE6DC; --hover:#F8F2EB;
  --text:#231F20; --text-2:#5E5A57; --text-3:#97908A;
  --border:#ECE3D9; --border-strong:#D8CCBF;
  --side:#231F20; --side-active:#EAD3C6; --side-active-text:#231F20; --side-hover:rgba(255,255,255,.08); --side-text:#FFFFFF; --side-text-2:rgba(255,255,255,.86); --side-line:rgba(255,255,255,.14);
  --accent:#231F20; --accent-text:#FFFFFF; --focus:#231F20; --check:#231F20; --danger:#A3473A;
  --chip:transparent; --chip-t:#231F20; --chip-line:#231F20;
  --lgreen:#EAD3C6; --lgreen-t:#231F20; --blue:#EFE4D8; --blue-t:#231F20; --purple:#D9D9D6; --purple-t:#231F20;
  --teal:#CA9A8E; --teal-t:#231F20; --green:#231F20; --green-t:#FFFFFF; --amber:transparent; --amber-t:#231F20;
  --pink:#231F20; --pink-t:#FFFFFF; --yellow:#EAD3C6; --yellow-t:#231F20;
  --tile1:#EAD3C6; --tile2:#EFE4D8; --tile3:#D9D9D6; --tile-t:#231F20;
  --done:#231F20; --done-t:#FFFFFF; --done-t2:rgba(255,255,255,.72);
  --banner:#EAD3C6;
  --shadow:0 1px 2px rgba(60,40,30,.05),0 10px 28px rgba(60,40,30,.08); --overlay:rgba(35,31,32,.3);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1716; --surface:#242020; --surface-2:#2B2625; --surface-3:#36302D; --hover:#2E2927;
    --text:#F0E5D7; --text-2:#C9BBAE; --text-3:#8F837A; --border:#3A3330; --border-strong:#4E4541;
    --side:#0F0D0D; --side-active:#EAD3C6; --side-active-text:#231F20; --side-hover:rgba(255,255,255,.06); --side-text:#F0E5D7; --side-text-2:#C9BBAE; --side-line:rgba(240,229,215,.14);
    --accent:#EAD3C6; --accent-text:#231F20; --focus:#EAD3C6; --check:#EAD3C6; --danger:#E79A8A;
    --chip:transparent; --chip-t:#F0E5D7; --chip-line:#C9BBAE;
    --lgreen:#5A463F; --lgreen-t:#F0E5D7; --blue:#3A322F; --blue-t:#E8DCCD; --purple:#45413F; --purple-t:#E8E4E0;
    --teal:#8A6359; --teal-t:#FFF4EE; --green:#F0E5D7; --green-t:#231F20; --amber:transparent; --amber-t:#F0E5D7;
    --pink:#F0E5D7; --pink-t:#231F20; --yellow:#5A463F; --yellow-t:#F0E5D7;
    --tile1:#4A3A35; --tile2:#3A332F; --tile3:#3B3A39; --tile-t:#F0E5D7;
    --done:#0F0D0D; --done-t:#F0E5D7; --done-t2:rgba(240,229,215,.7); --banner:#4A3A35;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4); --overlay:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1716; --surface:#242020; --surface-2:#2B2625; --surface-3:#36302D; --hover:#2E2927;
  --text:#F0E5D7; --text-2:#C9BBAE; --text-3:#8F837A; --border:#3A3330; --border-strong:#4E4541;
  --side:#0F0D0D; --side-active:#EAD3C6; --side-active-text:#231F20; --side-hover:rgba(255,255,255,.06); --side-text:#F0E5D7; --side-text-2:#C9BBAE; --side-line:rgba(240,229,215,.14);
  --accent:#EAD3C6; --accent-text:#231F20; --focus:#EAD3C6; --check:#EAD3C6; --danger:#E79A8A;
  --chip:transparent; --chip-t:#F0E5D7; --chip-line:#C9BBAE;
  --lgreen:#5A463F; --lgreen-t:#F0E5D7; --blue:#3A322F; --blue-t:#E8DCCD; --purple:#45413F; --purple-t:#E8E4E0;
  --teal:#8A6359; --teal-t:#FFF4EE; --green:#F0E5D7; --green-t:#231F20; --amber:transparent; --amber-t:#F0E5D7;
  --pink:#F0E5D7; --pink-t:#231F20; --yellow:#5A463F; --yellow-t:#F0E5D7;
  --tile1:#4A3A35; --tile2:#3A332F; --tile3:#3B3A39; --tile-t:#F0E5D7;
  --done:#0F0D0D; --done-t:#F0E5D7; --done-t2:rgba(240,229,215,.7); --banner:#4A3A35;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4); --overlay:rgba(0,0,0,.55);
  color-scheme:dark;
}
body{font-family:var(--sans);letter-spacing:0}
/* Serif headlines, regular weight */
.brand h1,.h-req,.dtitle,.card h3,.panel-head h2,.listhead .ttl,.stat-h,.tl-head h3,.chat h3,.dhead h2,.empty h3,.count .num,.dsum dd,.banner b{font-family:var(--serif);font-weight:400;letter-spacing:-.005em}
/* Floating black sidebar */
.app{grid-template-columns:256px 1fr;background:var(--bg)}
.side{margin:16px 0 16px 16px;border-radius:22px;border:0;height:auto;max-height:calc(100% - 32px);align-self:start;min-height:min(560px,calc(100% - 32px))}
.brand{padding:26px 22px 8px}
.brand svg{display:none}
.brand h1{font-size:30px;line-height:1.05}
.nav-label{display:block;font-size:11px;text-transform:uppercase;color:var(--side-text-2);opacity:.75;padding:22px 22px 8px}
.nav{gap:4px;padding:0 14px}
.nav a{padding:9px 12px;border-radius:9px;font-size:15px;color:var(--side-text)}
.nav a[aria-current="page"]{background:var(--side-active);color:var(--side-active-text);font-weight:500}
.side-new{margin:18px 22px 0;border-radius:999px;border-color:rgba(255,255,255,.35);text-transform:uppercase;font-size:11.5px;font-weight:500;padding:8px 14px}
.side-foot{border-top-color:var(--side-line);padding:14px 22px}
/* Top bar */
.topbar{border-bottom:0;min-height:72px;padding:16px 28px 0}
.crumbs{font-size:13px;text-transform:uppercase;color:var(--text-3)}
.crumbs b{font-family:var(--sans);font-weight:500;color:var(--text)}
.tbtn{border-radius:999px;font-size:12px;text-transform:uppercase;font-weight:500;padding:8px 14px;box-shadow:inset 0 0 0 1px var(--text)}
.tbtn:hover{background:var(--surface)}
.tools .tbtn[aria-label]{box-shadow:none}
.menu-btn,.listtools .tbtn{box-shadow:none}
.ibtn{border-radius:999px;background:var(--surface);border-color:var(--border)}
.page{padding:12px 28px 48px}
.top-search{background:var(--surface);box-shadow:inset 0 0 0 1px var(--border-strong)}
.search{border-radius:999px}
/* Dashboard */
.h-req{font-size:40px;margin:0 0 16px}
.banner{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;background:var(--banner);border-radius:16px;padding:16px 22px;margin:0 0 16px;color:var(--text)}
.banner b{font-size:22px}
.banner span{font-size:14px;color:var(--text-2)}
.panel{border:0;border-radius:22px;background:var(--surface)}
.kpis{gap:14px}
.kpis .count{border-radius:18px;border:0;display:flex;flex-direction:column;align-items:flex-start;padding:18px 20px;color:var(--tile-t)}
.kpis .count:nth-child(3n+1){background:var(--tile1)}
.kpis .count:nth-child(3n+2){background:var(--tile2)}
.kpis .count:nth-child(3n){background:var(--tile3)}
.kpis.four .count:nth-child(1){background:var(--tile1)} .kpis.four .count:nth-child(2),.kpis.four .count:nth-child(3){background:var(--tile2)} .kpis.four .count:nth-child(4){background:var(--tile3)}
button.count:hover{filter:brightness(.97);background:inherit}
.count .lbl{font-size:13px;color:inherit}
.count .num{font-size:46px;line-height:1.1;margin-top:6px}
.count .num small{font-family:var(--sans);font-size:22px}
.count .hint{color:inherit;opacity:.72;font-size:12px}
.stat-h{font-size:26px;margin:30px 0 14px}
.panel-head{padding:22px 24px 4px}
.panel-head h2{font-size:26px}
.panel-head .sub{text-transform:uppercase;font-size:11px}
.stable th,.stable td{padding:12px 24px}
.stable thead th{border-bottom-color:var(--border)}
.thbtn{font-size:11px;text-transform:uppercase;font-weight:500;color:var(--text-3)}
.rowlink{font-weight:500}
/* Chips: tiny all-caps pills */
.chip{text-transform:uppercase;font-size:10.5px;font-weight:500;line-height:18px;padding:2px 9px;background:var(--chip);color:var(--chip-t);box-shadow:inset 0 0 0 1px var(--chip-line)}
.chip[class*=" c-"]{box-shadow:none}
.chip.c-lgreen{background:var(--lgreen);color:var(--lgreen-t)}.chip.c-blue{background:var(--blue);color:var(--blue-t)}.chip.c-purple{background:var(--purple);color:var(--purple-t)}.chip.c-teal{background:var(--teal);color:var(--teal-t)}.chip.c-green{background:var(--green);color:var(--green-t)}.chip.c-amber{background:var(--amber);color:var(--amber-t)}.chip.c-pink{background:var(--pink);color:var(--pink-t)}.chip.c-yellow{background:var(--yellow);color:var(--yellow-t)}
.c-amber{box-shadow:inset 0 0 0 1px var(--chip-line)!important}
.person{border-radius:999px;font-size:12.5px;background:var(--surface)}
/* Gallery cards with dome image */
.gallery{gap:16px}
.card{border:0;border-radius:22px;background:var(--surface)}
.card:hover{box-shadow:var(--shadow)}
.thumb{margin:18px 18px 0;height:180px;border-radius:12px;background:var(--tile1);color:rgba(35,31,32,.28)}
.thumb svg{width:70px;height:70px}
.card .body{padding:16px 22px 22px}
.card .pnum{font-size:11px;text-transform:uppercase;color:var(--text-3)}
.card h3{font-size:22px;line-height:1.15}
.card .cmeta{border-top-color:var(--border)}
.card .cmeta dt{font-size:13px}
/* SKU split */
.listpane{border-right:0;background:var(--surface);margin:16px 0 16px 16px;border-radius:22px;overflow:hidden}
.list{border-top-color:var(--border)}
.li{border-bottom-color:var(--border)}
.li .lt{width:84px;height:84px;border-radius:12px;background:var(--tile1)}
.li[aria-current="true"]{background:var(--surface-2)}
.listhead .ttl{font-size:28px}
.detail-inner{background:var(--surface);border-radius:22px;margin:16px;padding:24px 40px 48px}
.dtitle{font-size:clamp(30px,3.4vw,46px);border-bottom-color:var(--border)}
/* Buttons */
.btn{border-radius:999px;text-transform:uppercase;font-weight:500;font-size:12px;padding:10px 18px}
.btn.ghost,.btn.danger{border-color:var(--text)}
.btn.danger{border-color:var(--danger)}
.holdbtn{padding:7px 14px;font-size:11px}
/* Drawer */
.drawer{background:var(--bg)}
.dhead{background:var(--bg);border-bottom-color:var(--border)}
.drawer .dbody{padding:22px 32px 48px}
.drawer .dtitle{font-size:36px;background:var(--surface);border-radius:22px;padding:24px 26px;border-bottom:0;margin-bottom:16px}
.dsum dt{font-size:11px;text-transform:uppercase;color:var(--text-3)}
.dsum dd{font-size:17px}
.dsum .person,.dsum .chip{font-family:var(--sans)}
.fields .fl{font-size:15px}
.attach{background:var(--surface);border-radius:18px}
.detail-inner .attach{background:var(--surface-2)}
.morebtn{color:var(--text);text-decoration:underline;text-transform:uppercase;font-size:12px}

async function saveField(id, patch){
  const r=rec(id); if(!r) return;
  const prev={}; Object.keys(patch).forEach(k=>prev[k]=r[k]);
  if("status" in patch && patch.status!==r.status){
    patch.history=[...(Array.isArray(r.history)?r.history:[]),{status:patch.status,at:todayIso()}]; prev.history=r.history;
    if(patch.status==="Completed"){ if(!("completedAt" in patch)) patch.completedAt=todayIso(); prev.completedAt=r.completedAt;
      if(!("milestones" in patch)){ const ms={...((r.milestones&&typeof r.milestones==="object")?r.milestones:{})}; if(!ms.release){ ms.release=patch.completedAt; patch.milestones=ms; prev.milestones=r.milestones; } } }
    else if(r.status==="Completed"){ patch.completedAt=""; prev.completedAt=r.completedAt;
      if(!("milestones" in patch)){ const ms={...((r.milestones&&typeof r.milestones==="object")?r.milestones:{})}; if(ms.release){ delete ms.release; patch.milestones=ms; prev.milestones=r.milestones; } } }
  }
  Object.assign(r,patch);
  const statusMsg = ("status" in patch && patch.status!==prev.status && !("milestones" in patch && patch.status!=="Completed")) ? `Status changed to ${patch.status}` : "";
  if(S.mode==="local"){ persistLocal(); scheduleRender(); if(statusMsg) logActivity(id,statusMsg); return; }
  scheduleRender();
  try{ await S.db.collection("requests").doc(id).update(patch); if(statusMsg) logActivity(id,statusMsg); }
  catch(e){
    Object.assign(r,prev); scheduleRender();
    if(e && e.code==="invalid_argument"){ S.canWrite=false; render(); toast("You can view this base but not change it."); }
    else toast("That change wasn't saved. Try again in a moment.");
  }
}
async function createRecord(data){

  const id="r"+Date.now().toString(36);
  const body={title:"",due:"",accepted:false,type:"",brand:"",requestor:"",designer:"",lead:"",priority:"",driver:"",status:"New request",requestorId:S.me||"",requestedAt:todayIso(),description:"",link:"",requestAssets:[],notes:"",versions:[],sku:"",styleName:"",upc:"",...data,number:num};

async function uploadFiles(id, files, key){

function stats(){
  const t=todayIso(), d30=new Date(Date.now()-30*864e5), since=`${d30.getFullYear()}-${String(d30.getMonth()+1).padStart(2,"0")}-${String(d30.getDate()).padStart(2,"0")}`;
  const done=S.records.filter(r=>r.status==="Completed");
  const withDue=S.records.filter(r=>r.due);
  const isLate=r=> r.status==="Completed" ? !!(r.completedAt && r.completedAt>r.due) : r.due<t;
  const late=withDue.filter(isLate);
  const month=done.filter(r=>r.completedAt && r.completedAt>=since);
  const assets=done.reduce((n,r)=>n+(r.versions||[]).length,0);
  const pct=withDue.length?Math.round(100*(withDue.length-late.length)/withDue.length):null;
  return {done,late,month,assets,pct,withDue};
}

function chartSvg(data){
  const W=900,H=330,L=48,R=20,T=18,B=80, iw=W-L-R, ih=H-T-B;
  const max=Math.max(1,...data.map(d=>d[1]));
  const step=max<=6?1:Math.ceil(max/5);
  const top=Math.ceil(max/step)*step;
  let g="";
  for(let v=0; v<=top; v+=step){ const y=T+ih-(v/top)*ih; g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-14}" y="${y+4}" text-anchor="end">${v}</text>`; }
  const bw=iw/Math.max(1,data.length), pad=Math.min(60,bw*0.1);
  data.forEach(([k,v],i)=>{
    const x=L+i*bw+pad, w=bw-pad*2, h=(v/top)*ih, y=T+ih-h;
    g+=`<rect class="bar" x="${x}" y="${y}" width="${Math.max(0,w)}" height="${h}" rx="2" tabindex="0" role="button" data-act="bar" data-k="${esc(k)}" aria-label="${esc(k)}: ${v} request${v===1?"":"s"}"><title>${esc(k)}: ${v}</title></rect>`;
    const cx=L+i*bw+bw/2;
    g+=`<text x="${cx}" y="${T+ih+22}" text-anchor="end" transform="rotate(-38 ${cx} ${T+ih+22})">${esc(k)}</text>`;
  });
  g+=`<line class="grid" x1="${L}" x2="${L}" y1="${T}" y2="${T+ih}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of request counts">${g}</svg>`;
}
function pivotHtml(rf,cf){

  const btn=(n,rv,cv)=> n? `<button class="cellbtn" data-act="cell" data-rf="${rf}" data-cf="${cf}" data-rv="${esc(rv??"")}" data-cv="${esc(cv??"")}">${n}</button>` : `<span class="zero">0</span>`;
  let h=`<div class="pivot-wrap"><table class="pivot"><thead><tr><th scope="col">${esc(GROUPABLE[rf])}, ${esc(GROUPABLE[cf].replace(/^./,c=>c.toLowerCase()))}</th>`;

  return h;

function fieldValue(r,k){

  if(!ed){
    if(!v && v!==0) return `<span class="val zero">—</span>`;
    if(kind==="select") return chip(k,v);

    if(kind==="date") return `<span class="val">${esc(fmtDate(v))}</span>`;
    return `<span class="val${kind==="long"?" long":""}">${esc(v)}</span>`;

/* ---------- project chat ---------- */
S.chat={}; S.names={}; S.me=null; S.user=null;
let chatFor=null, chatUnsub=null;
function loadLocalChat(){ try{ return JSON.parse(localStorage.getItem("dam-chat-v1")||"{}"); }catch(e){ return {}; } }
function ensureChat(id){
  if(chatFor===id) return;
  stopChat(); chatFor=id;
  if(S.mode!=="db"){ S.chat[id]=(loadLocalChat()[id]||[]); return; }
  try{
    chatUnsub=S.db.collection("requests/"+id+"/chat").orderBy("at","asc").limit(500).onSnapshot(snap=>{
      S.chat[id]=snap.docs.map(d=>({id:d.id,...d.data()}));
      if(chatFor===id) updateChat();
    }, ()=>{ if(chatFor===id){ S.chatErr=true; updateChat(); } });
  }catch(e){ S.chatErr=true; }
}
function stopChat(){ if(chatUnsub){ try{ chatUnsub(); }catch(e){} } chatUnsub=null; chatFor=null; }
function fmtTime(iso){ const d=new Date(iso); if(isNaN(d)) return ""; return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }
function msgHtml(m){
  const mine = S.mode!=="db" || (S.me && m.author===S.me);
  const name = S.mode!=="db" ? "You" : (mine ? "You" : (S.names[m.author] || "Someone"));
  const ini = name==="You"||name==="Someone" ? name[0] : name.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
  return `<li class="msg${mine?" mine":""}"><i class="av" aria-hidden="true">${esc(ini)}</i><div class="mb"><div class="mh"><b>${esc(name)}</b><time>${esc(fmtTime(m.at))}</time></div>${m.text||m.pin?`<p>${mentionText(m)}</p>`:""}${msgFilesHtml(m)}</div></li>`;
}
/* ---------- attachments on chat messages and file comments ---------- */
S.attPend={chatIn:[],fcIn:[]};
function msgFilesHtml(m){ const fs=Array.isArray(m.files)?m.files:[]; if(!fs.length) return "";
  return `<div class="matt">${fs.map(f=>{ const u=esc(blobUrl(f)); return isImage(f)?`<a class="matt-img" href="${u}" target="_blank" rel="noopener" title="${esc(f.name)}"><img src="${u}" alt="${esc(f.name)}" loading="lazy"></a>`:`<a class="matt-file" href="${u}" target="_blank" rel="noopener"><b>${esc(ext(f))}</b><span>${esc(f.name)}</span></a>`; }).join("")}</div>`; }
function attPendHtml(k){ const l=S.attPend[k]||[]; return l.map((f,i)=>`<span class="attchip${f.busy?" busy":""}">${f.busy?"Uploading… ":""}${esc(f.name)}${f.busy?"":`<button data-attrm="${k}" data-i="${i}" aria-label="Remove ${esc(f.name)}">×</button>`}</span>`).join(""); }
function refreshAtt(k){ const el=document.getElementById("attp-"+k); if(el) el.innerHTML=attPendHtml(k); }
function readDataUrl(f){ return new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=no; r.readAsDataURL(f); }); }
async function addAttachments(k,files){
  for(const f of files){
    if(S.mode!=="db"){ if(f.size>2e6){ toast(`${f.name} is too large to attach here (2 MB limit while working locally).`); continue; } try{ S.attPend[k].push({name:f.name,type:f.type,size:f.size,url:await readDataUrl(f)}); }catch(e){ toast(`${f.name} couldn't be attached.`); } refreshAtt(k); continue; }
    if(!S.assets){ toast("Attaching files needs edit access. Ask IT if you're on the read-only list."); return; }
    const slot={name:f.name,busy:true}; S.attPend[k].push(slot); refreshAtt(k);
    try{ const res=await S.assets.upload(f); Object.assign(slot,{busy:false,id:res.id,type:res.contentType||f.type,size:res.sizeBytes||f.size}); }
    catch(e){ const c=e&&e.code; S.attPend[k]=S.attPend[k].filter(x=>x!==slot); toast(c==="unsupported_type"?`${f.name} isn't a supported file type.`:c==="too_large"?`${f.name} is too large to attach.`:`${f.name} couldn't be attached.`); }
    refreshAtt(k);
  }
}
function takeAttachments(k){ if((S.attPend[k]||[]).some(f=>f.busy)) return null; const l=(S.attPend[k]||[]).map(f=>{ const o={name:f.name,type:f.type||"",size:f.size||0}; if(f.id) o.id=f.id; if(f.url) o.url=f.url; return o; }); S.attPend[k]=[]; refreshAtt(k); return l; }
document.addEventListener("click",e=>{ const b=e.target.closest("[data-att]"); if(b){ const k=b.dataset.att, inp=document.createElement("input"); inp.type="file"; inp.multiple=true; inp.onchange=()=>{ if(inp.files.length) addAttachments(k,[...inp.files]); }; inp.click(); return; }
  const r=e.target.closest("[data-attrm]"); if(r){ S.attPend[r.dataset.attrm].splice(Number(r.dataset.i),1); refreshAtt(r.dataset.attrm); } });
document.addEventListener("paste",e=>{ const t=e.target; if(!t||(t.id!=="chatIn"&&t.id!=="fcIn")) return; const fs=[...(e.clipboardData&&e.clipboardData.files||[])]; if(fs.length){ e.preventDefault(); addAttachments(t.id,fs); } });
/* ---------- @mentions in chat ---------- */
function mentionName(id){ return (S.mode==="db" ? (memberName(id)||S.names[id]||"") : String(id).replace(/^n:/,"")); }
function mentionText(m){ let h=esc(m.text||""); (Array.isArray(m.mentions)?m.mentions:[]).forEach(id=>{ const nm=mentionName(id); if(!nm) return; const tok=esc("@"+nm); h=h.split(tok).join(`<span class="ment${id===S.me?" me":""}">${tok}</span>`); }); return h; }
function mentionPeople(){
  const m=new Map(); const add=(id,name)=>{ name=String(name||"").trim(); if(id && name && id!==S.me && !m.has(id)) m.set(id,name); };
  if(S.mode==="db"){ Object.keys(S.members||{}).forEach(id=>add(id,memberName(id))); Object.entries(S.names||{}).forEach(([id,n])=>add(id,n)); }
  else { const names=new Set(); S.records.forEach(r=>["requestor","designer","lead"].forEach(k=>r[k]&&names.add(r[k]))); [...(S.roster.leads||[]),...(S.roster.designers||[])].forEach(n=>names.add(n)); names.forEach(n=>add("n:"+n,n)); }
  return [...m.entries()].map(([id,name])=>({id,name})).sort((a,b)=>a.name.localeCompare(b.name));
}
S.chatMentions={}; let mentState=null;
function mentionToken(ta){ const before=ta.value.slice(0,ta.selectionStart); const mt=before.match(/(^|\s)@([^\s@]{0,30})$/); return mt?{q:mt[2],start:ta.selectionStart-mt[2].length-1}:null; }
function closeMention(){ mentState=null; const pp=$("#mentPop"); if(pp) pp.remove(); }
function showMention(ta){
  const tk=mentionToken(ta); if(!tk){ closeMention(); return; }
  const q=tk.q.toLowerCase(), hits=mentionPeople().filter(p=>!q||p.name.toLowerCase().split(/\s+/).some(w=>w.startsWith(q))||p.name.toLowerCase().startsWith(q)).slice(0,6);
  if(!hits.length){ closeMention(); return; }
  mentState={ta:ta.id,tk,hits,i:mentState&&mentState.hits.length===hits.length?Math.min(mentState.i,hits.length-1):0};
  let pp=$("#mentPop"); if(!pp){ pp=document.createElement("div"); pp.id="mentPop"; pp.className="mentpop"; pp.setAttribute("role","listbox"); ta.parentElement.appendChild(pp); }
  pp.innerHTML=""; hits.forEach((h,i)=>{ const b=document.createElement("button"); b.type="button"; b.className="mentopt"+(i===mentState.i?" on":""); b.dataset.mi=i; b.setAttribute("role","option"); b.textContent=h.name; pp.append(b); });
}
function pickMention(i){ const ta=mentState&&document.getElementById(mentState.ta); if(!ta||!mentState) return; const h=mentState.hits[i]; if(!h) return; const {start}=mentState.tk, end=ta.selectionStart; const ins="@"+h.name+" ";
  ta.value=ta.value.slice(0,start)+ins+ta.value.slice(end); const pos=start+ins.length; ta.setSelectionRange(pos,pos); S.chatMentions[h.name]=h.id; closeMention(); ta.focus(); }
function isMentTa(t){ return !!t && (t.id==="chatIn"||t.id==="fcIn"); }
function collectMentions(text){ const ids=[...new Set(Object.entries(S.chatMentions).filter(([nm])=>text.includes("@"+nm)).map(([,mid])=>mid))]; S.chatMentions={}; closeMention(); return ids; }
document.addEventListener("input",e=>{ if(isMentTa(e.target)) showMention(e.target); });
document.addEventListener("mousedown",e=>{ const b=e.target.closest(".mentopt"); if(b){ e.preventDefault(); pickMention(Number(b.dataset.mi)); return; } if(mentState && !e.target.closest("#mentPop") && e.target.id!==mentState.ta) closeMention(); });
/* Capture phase, registered before the file viewer's keys, so Enter/Escape pick or close the list instead of sending or closing the viewer. */

/* ---------- project timeline (milestones) ---------- */
const MILESTONES=[["internal","Internal review"],["external","External review"],["approval","Creative approval from requestor"],["release","Released (project completed)"]];
function timelineHtml(r){
  const ms=(r.milestones&&typeof r.milestones==="object")?r.milestones:{};
  const ed=S.canWrite, onHold=r.status==="On hold";
  const boxes=MILESTONES.map(([k,label],i)=>{
    const d=ms[k]||(k==="release"&&r.status==="Completed"?(r.completedAt||"?"):""), done=!!d;
    let sub = k==="release" ? "Ticking this marks the project Completed and records the release date" : k==="internal" ? "Ticking this sets the status to Internal review" : k==="external" ? "Ticking this sets the status to External review" : "";
    let can = ed;
    const MSROLE={internal:[["Creative designer"],"the designer"],external:[["Creative lead"],"the creative lead"],release:[["Project manager","Creative designer","Creative lead"],"the project manager, designer or creative lead"]};
    if(MSROLE[k]){ const [roles,who]=MSROLE[k]; can = ed && roles.includes(S.urole); if(!roles.includes(S.urole)) sub=(sub?sub+". ":"")+`Only ${who} can tick this`; }
    if(k==="approval"){
      const rid=r.requestorId, rname=(rid&&S.names[rid])||r.requestor||"";
      if(rid && S.user && !(rid in S.names)){ S.names[rid]=""; S.user.profiles([rid]).then(ps=>{ S.names[rid]=(ps[rid]&&ps[rid].name)||""; scheduleRender(); }).catch(()=>{}); }
      const isReq = S.urole==="Requestor" && (S.mode!=="db" || (!!rid && rid===S.me));
      can = ed && isReq;
      const link = S.isEditor && S.mode==="db" ? ` <button class="ms-link" data-act="linkreq" data-id="${r.id}">${rid?"Change":"Link account"}</button>` : "";
      sub = S.mode!=="db" ? (r.requestor?`Requestor: ${esc(r.requestor)}`:"Requestor not set")+(S.urole!=="Requestor"?". Only the requestor can tick this":"")
        : !rid ? `Only the requestor can approve. Their account isn't linked yet.${link}`
        : isReq ? `You're the requestor, so you can approve this.${link}`
        : S.urole!=="Requestor" && rid===S.me ? `Switch to the Requestor role to approve this.${link}`
        : `Only ${esc(rname||"the requestor")} can approve this.${link}`;
    }
    const dateHtml = done ? `<span class="ms-dv">${d==="?"?"Date not recorded":esc(fmtDate(d))}</span>` : `<span class="ms-pending">Not yet</span>`;
    const box = can ? `<button class="ms-check${done?" on":""}" role="checkbox" aria-checked="${done}" data-act="ms" data-id="${r.id}" data-ms="${k}" aria-label="${esc(label)}">${done?I.check:""}</button>` : `<span class="ms-check${done?" on":""}" aria-hidden="true">${done?I.check:""}</span>`;
    return `<li class="ms-box${done?" done":""}">${box}<div class="ms-txt"><div class="ms-t">${esc(label)}</div>${sub?`<div class="ms-s">${sub}</div>`:""}</div>${dateHtml}</li>`;
  }).join("");
  const t=todayIso(), late=r.due && r.status!=="Completed" && r.due<t;
  const dueLine=r.due?`<span class="${late?"late":""}">Due ${esc(fmtDate(r.due))}${late?", past due":""}</span>`:`<span class="zero">No due date</span>`;
  const hold=ed&&r.status!=="Completed"?`<button class="btn ghost holdbtn" data-act="togglehold" data-id="${r.id}">${onHold?"Resume project":"Put on hold"}</button>`:"";
  return `<section class="timeline" aria-label="Project timeline"><div class="tl-head"><h3>Project timeline</h3>${onHold?'<span class="chip c-amber">On hold</span>':""}</div>
    <ol class="ms-list">${boxes}</ol><div class="tl-foot">${dueLine}${hold}</div></section>`;
}
function setMilestone(id,k,date){
  { const lbl=(MILESTONES.find(m=>m[0]===k)||[])[1]||k; setTimeout(()=>logActivity(id, date?`${lbl} ticked`:`${lbl} unticked`),0); }
  const r=rec(id); if(!r) return;
  const ms={...((r.milestones&&typeof r.milestones==="object")?r.milestones:{})};
  if(date) ms[k]=date; else delete ms[k];
  const patch={milestones:ms};
  if(k==="release" && date){ patch.status="Completed"; patch.completedAt=date; }
  else if(r.status!=="On hold") patch.status=stageStatus(r,ms);
  if(patch.status===r.status) delete patch.status;
  saveField(id,patch);
}
/* The furthest ticked timeline box decides the status. */
function stageStatus(r, ms){
  ms = ms || ((r.milestones&&typeof r.milestones==="object")?r.milestones:{});
  if(ms.release) return "Completed";
  if(ms.approval) return "Approved";
  if(ms.external) return "External review";
  if(ms.internal) return "Internal review";
  return (r.lead && r.designer) ? "In creative" : "New request";
}

  const byStyle=new Map(); pd.forEach(p=>{ const s=String(p.style||"").trim(); if(s&&!byStyle.has(s)) byStyle.set(s,p); });
  const subs=[...new Set(pd.map(p=>p.subcat||p.category||"").filter(Boolean))].sort();
  const apply=(c,p)=>{ const r={...c}; r._pdId=p.id; const lock=["sku"];
    const set=(k,v)=>{ if(v!=null&&v!==""){ r[k]=v; lock.push(k); } };

function matchSku(text){

  for(const tok of toks){ if(tok.length<8) continue; const x=S.skus.find(s=>{ const u=String(s.upc||"").replace(/\D/g,""); return u&&(u===tok||u.endsWith(tok)||tok.endsWith(u)); }); if(x) return x.id; }
  const codes=(t.toUpperCase().match(/KRB[A-Z]{2}-\d{3}|KM\d{3}/g)||[]);
  for(const c of codes){ const hits=S.skus.filter(s=>String(s.dieline||"").toUpperCase().includes(c)); if(hits.length===1) return hits[0].id; }
  const low=t.toLowerCase().replace(/[^a-z0-9]+/g," ");

function sentenceCase(t){

  return s.toLowerCase().replace(/[a-z&]+/g,w=>{ const U=w.toUpperCase(); return KEEPUP.has(U)?U:KEEPNAME.has(U)?U[0]+w.slice(1):w; })
    .replace(/\b(\d{3,4})\s?([cu])\b/g,(m,n,c)=>n+c.toUpperCase())
    .replace(/(^|[.!?:]\s+|\n\s*)([a-z])/g,(m,p,c)=>p+c.toUpperCase());
}
function colorsHtml(x){
  const cs=Array.isArray(x.colors)?x.colors:[]; if(!cs.length) return "";
  return `<div class="pmsgrid">${cs.map(c=>{ const codes=c.pending?[]:pmsCodes(c.pms); const same=codes.length===1&&pmsKey(c.pms)===codes[0].k;
    return `<div class="pmsitem"><div class="pmspart">${esc(c.part||"Color")}</div>${codes.length?`<div class="pmspills">${codes.map(pmsPill).join("")}</div>`:""}${same?"":`<div class="pmsraw">${esc(c.pending?"Pending":sentenceCase(c.pms))}</div>`}</div>`; }).join("")}</div>`;
}
function filesHtml(x){
  const ls=(Array.isArray(x.links)?x.links:[]).filter(l=>safeUrl(l.url)), die=x.dieline&&safeUrl(x.dielineUrl), au=safeUrl(x.assetsUrl);
  if(!ls.length&&!die&&!au) return "";
  return `<div class="flinks">${au?`<a class="flink" href="${esc(au)}" target="_blank" rel="noopener">Dropbox assets</a>`:""}${ls.map(l=>`<a class="flink" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">${esc(l.kind+(l.label?` (${l.label})`:""))}</a>`).join("")}${die?`<a class="flink" href="${esc(safeUrl(x.dielineUrl))}" target="_blank" rel="noopener">Dieline ${esc(x.dieline)}</a>`:""}</div>`;
}
function approvalsFor(nums){ const set=new Set(nums.filter(Boolean).map(String)); const out=[]; S.colors.forEach(c=>(c.products||[]).forEach(p=>{ if((p.skus||[]).some(s=>set.has(String(s)))) out.push({c,p}); })); return out.sort((a,b)=>(b.p.date||"").localeCompare(a.p.date||"")); }
const AFLAGS=[["nextPo","Next PO"],["techTransfer","Tech transfer"],["newProject","New project"]];
function apprHtml({c,p},withSkus){
  const flags=AFLAGS.filter(([k])=>p.flags&&p.flags[k]).map(([,l])=>`<span class="chip">${l}</span>`).join("");
  const skus=withSkus?(p.skus||[]).map(n=>{ const r=S.skus.find(x=>String(x.sku)===String(n)); return r?`<a class="skuchip" href="#sku/${esc(r.id)}">${esc(n)}</a>`:""; }).join(""):"";
  const links=(p.links||[]).filter(l=>safeUrl(l.url)).map(l=>`<a class="flink sm" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">${esc(l.label||"Link")}</a>`).join("");
  const notes=[p.barColor?`Bar color: ${p.barColor}`:"",...(p.notes||[]).map(sentenceCase)].filter(Boolean);
  const part=p.part?sentenceCase(p.part).replace(/^./,m=>m.toUpperCase()):"";
  return `<li class="appr"><div class="apprh">${withSkus?"":pmsPill({k:c.key,t:c.code})}<span class="apprt">${esc(p.title)}</span>${part?`<span class="apprp">${esc(part)}</span>`:""}</div>
    <div class="apprm">${esc(p.supplier||"Supplier not set")}, ${p.date?`last feedback ${esc(fmtDate(p.date))}`:"no feedback date yet"}</div>
    ${flags?`<div class="apprflags">${flags}</div>`:""}${p.feedback?`<p class="apprfb">${esc(sentenceCase(p.feedback))}</p>`:""}
    ${notes.length?`<p class="apprnote">${esc(notes.join(". "))}</p>`:""}${skus||links?`<div class="flinks">${skus}${links}</div>`:""}</li>`;
}
function skuSpecHtml(x){
  const ed=canEditSku(), col=colorsHtml(x), files=filesHtml(x), appr=approvalsFor([x.sku,x.coreSku]); let h="";
  if(col||ed) h+=specSec(x,"colors","Colors",(x.colors||[]).length,col||`<p class="chat-empty" style="margin:0">No colors yet.</p>`);
  if(files||ed) h+=specSec(x,"files","Files",(x.links||[]).length+(x.dieline?1:0),files||`<p class="chat-empty" style="margin:0">No files yet.</p>`);
  if(isCreative()) h+=skuCopyHtml(x);
  if(S.urole==="Creative lead" && (appr.length||ed)) h+=specSec(x,"appr","Color approvals",appr.length,appr.length?`<ul class="apprlist">${appr.map(o=>apprHtml(o,false)).join("")}</ul>`:`<p class="chat-empty" style="margin:0">No color approvals yet.</p>`);
  return h;
}

function specSec(x,k,title,n,view){

}

function specStart(x,k){
  let d;
  if(k==="colors") d=(x.colors||[]).map(c=>({part:c.part||"",pms:c.pms||"",pending:!!c.pending}));
  else if(k==="files") d={assets:x.assets||"",assetsUrl:x.assetsUrl||"",dieline:x.dieline||"",dielineUrl:x.dielineUrl||"",links:(x.links||[]).map(l=>({kind:l.kind||"",label:l.label||"",url:l.url||""}))};
  else d=approvalsFor([x.sku,x.coreSku]).map(({c,p})=>({cid:c.id,idx:(c.products||[]).indexOf(p),code:c.code,title:p.title||"",part:p.part||"",supplier:p.supplier||"",date:p.date||"",barColor:p.barColor||"",flags:{...(p.flags||{})},feedback:p.feedback||"",notesText:(p.notes||[]).join("\n")}));
  S.specEdit[specKey(x,k)]=d;
}
function specRec(key){ const [id,k]=key.split("|"); return {x:skuRec(id),k,d:S.specEdit[key]}; }
async function persistColor(c,products){
  c.products=products;
  if(S.mode!=="db"){ try{ localStorage.setItem("dam-colors-v1",JSON.stringify(S.colors)); }catch(e){} return; }
  await S.db.collection("colors").doc(c.id).update({products});
}
async function specSave(key){
  const {x,k,d}=specRec(key); if(!x||!d||!canEditSku()) return;
  try{
    if(k==="colors"){ await saveSku(x.id,{colors:d.map(c=>({part:String(c.part).trim(),pms:String(c.pms).trim(),pending:!!c.pending})).filter(c=>c.part||c.pms)}); }
    else if(k==="files"){
      const bad=d.links.find(l=>String(l.url).trim()&&!safeUrl(l.url)); if(bad){ toast("Each file link needs a full https:// address."); return; }
      if(String(d.assetsUrl).trim()&&!safeUrl(d.assetsUrl)){ toast("The Dropbox link needs a full https:// address."); return; }
      await saveSku(x.id,{assets:String(d.assets).trim(),assetsUrl:safeUrl(d.assetsUrl)||"",dieline:String(d.dieline).trim(),dielineUrl:safeUrl(d.dielineUrl)||"",links:d.links.map(l=>({kind:String(l.kind).trim()||"File",label:String(l.label).trim(),url:safeUrl(l.url)})).filter(l=>l.url)});
    } else {
      const byColor=new Map(), fresh=[];
      const rec=a=>({title:String(a.title).trim(),part:String(a.part).trim(),supplier:String(a.supplier).trim(),date:a.date||"",barColor:String(a.barColor).trim(),flags:{nextPo:!!a.flags.nextPo,techTransfer:!!a.flags.techTransfer,newProject:!!a.flags.newProject},feedback:String(a.feedback).trim(),notes:String(a.notesText||"").split("\n").map(s=>s.trim()).filter(Boolean)});
      for(const a of d){
        if(a.cid){ const c=S.colors.find(cc=>cc.id===a.cid); if(!c) continue; const e=byColor.get(c)||{edits:[],dels:[],adds:[]}; byColor.set(c,e); if(a._del) e.dels.push(a.idx); else e.edits.push([a.idx,rec(a)]); }
        else if(!a._del){ const code=String(a.code||"").trim(); if(!code){ toast("Pick a PMS color for each new approval."); return; } fresh.push([code,a]); }
      }
      for(const [code,a] of fresh){
        const kk=pmsKey(code); let c=colorRec(kk);
        const p={...rec(a),product:String(a.title).trim()||x.styleName||"",skus:[String(x.sku)],line:x.line||"",links:[],dateRaw:""};
        if(!p.title) p.title=x.styleName||String(x.sku);
        if(c){ const e=byColor.get(c)||{edits:[],dels:[],adds:[]}; byColor.set(c,e); e.adds.push(p); }
        else { const id="pms_"+kk.replace(/[^A-Za-z0-9_-]/g,""), doc={code:code.toUpperCase().replace(/\s+/g,""),key:kk,family:"",lab:[],products:[p]};
          if(S.mode!=="db"){ S.colors.push({id,...doc}); try{ localStorage.setItem("dam-colors-v1",JSON.stringify(S.colors)); }catch(e){} } else { await S.db.collection("colors").doc(id).set(doc); if(!colorRec(kk)) S.colors.push({id,...doc}); } }
      }
      for(const [c,e] of byColor){
        let ps=(c.products||[]).map(p=>JSON.parse(JSON.stringify(p)));
        e.edits.forEach(([i,r])=>{ if(ps[i]) ps[i]={...ps[i],...r}; });
        ps=ps.filter((p,i)=>!e.dels.includes(i)).concat(e.adds);
        await persistColor(c,ps);
      }
      toast("Color approvals saved.");
    }
    delete S.specEdit[key]; render();
  }catch(e){ toast(e&&e.code==="invalid_argument"?"You can view this but not change it.":"That wasn't saved. Try again."); }
}
document.addEventListener("input",e=>{ const t=e.target; if(!t.dataset||t.dataset.spec==null||t.type==="checkbox") return; const {k,d}=specRec(t.dataset.spec); if(!d) return; const i=Number(t.dataset.i), f=t.dataset.f; if(k==="files"&&i<0) d[f]=t.value; else if(k==="files") d.links[i][f]=t.value; else d[i][f]=t.value; });
document.addEventListener("change",e=>{ const t=e.target; if(!t.dataset||t.dataset.spec==null||t.type!=="checkbox") return; const {d}=specRec(t.dataset.spec); if(!d) return; const i=Number(t.dataset.i), f=t.dataset.f; if(f.startsWith("flag:")){ d[i].flags=d[i].flags||{}; d[i].flags[f.slice(5)]=t.checked; } else d[i][f]=t.checked; });
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  switch(t.dataset.act){
    case "specedit": { const x=skuRec(t.dataset.id); if(x&&canEditSku()){ specStart(x,t.dataset.k); render(); } break; }
    case "speccancel": delete S.specEdit[t.dataset.key]; render(); break;
    case "specsave": specSave(t.dataset.key); break;
    case "specadd": { const {k,d}=specRec(t.dataset.key); if(!d) break; if(k==="colors") d.push({part:"",pms:"",pending:false}); else if(k==="files") d.links.push({kind:"",label:"",url:""}); else d.push({cid:null,idx:null,code:"",title:"",part:"",supplier:"",date:todayIso(),barColor:"",flags:{},feedback:"",notesText:""}); render(); break; }
    case "specrm": { const {k,d}=specRec(t.dataset.key); if(!d) break; const i=Number(t.dataset.i); if(k==="files") d.links.splice(i,1); else if(k==="appr"){ if(d[i].cid) d[i]._del=true; else d.splice(i,1); } else d.splice(i,1); render(); break; }
  }
});

/* ---------- dieline list (built from the SKU catalog's dieline column) ---------- */
function renderDielinesPage(){ return topbar("Dielines")+`<div class="scroll"><div class="page">${S.skusLoaded?renderDielines():'<div class="loading">Loading dielines…</div>'}</div></div>`; }
S.dieQ="";
function parseDie(part){ const m=String(part).trim().replace(/\s+/g," ").match(/^(?:(.+?)\s+-\s+)?((?:KRB[A-Z]{2}-\d{3})|(?:KM\d{3}))$/i); return m?{label:(m[1]||"").trim(),code:m[2].toUpperCase()}:null; }
function dieFileName(u){ try{ return decodeURIComponent(new URL(u).pathname.split("/").pop()||""); }catch(e){ return ""; } }
function dieFileNums(name){ const m=String(name).match(/^KRB[A-Z]{2}-(\d{3}(?:-\d{3}(?=-|\.\w+$|$))*)/i); return m?m[1].split("-"):[]; }
function dielineIndex(){
  const map=new Map();
  [...S.skus].sort((a,b)=>(a.rowOrder??99999)-(b.rowOrder??99999)).forEach(x=>{
    if(!x.dieline) return;
    const codes=String(x.dieline).split(/\s*·\s*/).map(parseDie).filter(Boolean); if(!codes.length) return;
    const url=safeUrl(x.dielineUrl), name=url?dieFileName(url):"", nums=dieFileNums(name);
    codes.forEach(({code,label})=>{
      let e=map.get(code); if(!e){ e={code,labels:new Set(),skus:[],lines:new Set(),files:new Map()}; map.set(code,e); }
      if(label) e.labels.add(label); if(!e.skus.includes(x)) e.skus.push(x); if(x.line) e.lines.add(x.line);
      const match=nums.includes(code.slice(-3));
      const fk=name||url; if(url && (match || codes.length===1) && !e.files.has(fk)) e.files.set(fk,{url,name:name||"Dropbox link",match,nums});
    });
  });
  return [...map.values()].sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true}));
}
function renderDielines(emb){
  const all=dielineIndex(), q=(emb?S.tmplQ:S.dieQ).trim().toLowerCase();
  const list=all.filter(e=>!q||[e.code,...e.labels,...e.lines,...[...e.files.values()].map(f=>f.name),...e.skus.map(x=>x.sku+" "+(x.styleName||""))].join(" ").toLowerCase().includes(q));
  const bar=emb?"":`<div class="bar-row"><label class="search" style="flex:1;min-width:200px;max-width:420px">${I.search}<span class="sr">Search dielines</span><input data-search="dieq" value="${esc(S.dieQ)}" placeholder="Search dieline, SKU, product line…"></label><span class="agroup-n" style="margin-left:auto">${list.length} dieline${list.length===1?"":"s"}</span></div>`;
  if(!all.length) return bar+`<div class="empty"><h3>No dielines yet</h3><p>Dielines show up here once SKUs in the SKU catalog have a dieline number.</p></div>`;
  if(!list.length) return bar+`<div class="empty"><h3>No dielines match</h3><p>Try another dieline number, SKU or product line.</p></div>`;
  const rows=list.map(e=>{
    const files=[...e.files.values()].sort((a,b)=>b.match-a.match);
    const fileHtml=files.length?files.map(f=>{ const ext=(f.name.match(/\.([a-z0-9]+)$/i)||[])[1]; return `<div class="dfile"><a class="flink sm" href="${esc(f.url)}" target="_blank" rel="noopener" title="Open ${esc(f.name)}">${esc(ext?ext.toUpperCase():"Open")}</a><span class="dfname">${esc(f.name.replace(/\.[a-z0-9]+$/i,""))}</span>${f.match?"":`<span class="dwarn">${f.nums.length?`The sheet links a file numbered ${esc(f.nums.join("-"))} here`:"This file name has no dieline number"}</span>`}</div>`; }).join(""):`<span class="zero">No file linked in the sheet</span>`;
    const n=e.skus.length;
    return `<tr><td class="nowrap"><span class="dcode">${esc(e.code)}</span>${e.labels.size?`<div class="sub2">${esc([...e.labels].join(", "))}</div>`:""}</td>
      <td>${esc([...e.lines].join(", "))||'<span class="zero">—</span>'}</td>
      <td><details class="dskus"><summary>${n} SKU${n===1?"":"s"}</summary><div class="usedby">${e.skus.map(x=>`<a class="skuchip" href="#sku/${esc(x.id)}">${esc(x.sku)} · ${esc(x.styleName||"")}</a>`).join("")}</div></details></td>
      <td class="dfiles">${fileHtml}</td></tr>`;
  }).join("");
  return bar+`<section class="panel"><div class="pivot-wrap"><table class="stable pmtable dtable"><thead><tr><th scope="col">Dieline</th><th scope="col">Product lines</th><th scope="col">SKUs</th><th scope="col">File</th></tr></thead><tbody>${rows}</tbody></table></div></section>`+(emb?"":`<p class="note" style="margin:12px 0 0">Taken from the dieline column of the Master Consumables File. Dieline files your team uploads live in the <button class="linkbtn" data-act="assettab" data-t="templates">Templates</button> tab.</p>`);
}

/* --- getting the dieline onto a canvas --- */
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("That file couldn't be opened. Use a PNG, JPG or PDF.")); i.src=src; }); }
function imgToCanvas(img){

  const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(img.naturalWidth*k)); c.height=Math.max(1,Math.round(img.naturalHeight*k));
  const g=c.getContext("2d",{willReadFrequently:true}); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height); return c;
}
async function fileToCanvas(blob,name){
  if(isPdf({type:blob.type,name})){
    await loadScript(PDF_SRC); const lib=window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc=PDF_WORKER;
    const pdf=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;
    const page=await pdf.getPage(1), v1=page.getViewport({scale:1});
    const vp=page.getViewport({scale:Math.min(300/72,3600/Math.max(v1.width,v1.height))});
    const c=document.createElement("canvas"); c.width=Math.round(vp.width); c.height=Math.round(vp.height);
    const g=c.getContext("2d",{willReadFrequently:true}); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:g,viewport:vp}).promise; return c;
  }

}

    if(!r||!r.ok) throw new Error("This PDF couldn't be opened from the library. Download it and upload it here instead.");

/* --- fold/cut line detection (port of detect_folds.py) --- */
function groupIdx(idx,gap=3){ const out=[]; let cur=[]; for(const i of idx){ if(cur.length && i-cur[cur.length-1]>gap){ out.push(Math.round(cur.reduce((a,b)=>a+b,0)/cur.length)); cur=[]; } cur.push(i); } if(cur.length) out.push(Math.round(cur.reduce((a,b)=>a+b,0)/cur.length)); return out; }
function detectLines(c){
  const w=c.width,h=c.height,d=c.getContext("2d",{willReadFrequently:true}).getImageData(0,0,w,h).data;
  const fr=new Uint32Array(h),fc=new Uint32Array(w),cr=new Uint32Array(h),cc=new Uint32Array(w);
  for(let y=0,i=0;y<h;y++) for(let x=0;x<w;x++,i+=4){ const R=d[i],G=d[i+1],B=d[i+2];
    if(R>180&&R-G>50&&R-B>30){ fr[y]++; fc[x]++; } else if(B>170&&B-R>40){ cr[y]++; cc[x]++; } }
  const pick=(arr,len)=>{ const idx=[]; for(let i=0;i<arr.length;i++) if(arr[i]>len*0.04) idx.push(i); return groupIdx(idx); };
  return {fold_rows:pick(fr,w),fold_cols:pick(fc,h),cut_rows:pick(cr,w),cut_cols:pick(cc,h)};
}
function snapTo(v,arr,tol){ let best=v,bd=tol+1; for(const a of arr){ const dd=Math.abs(a-v); if(dd<bd){ bd=dd; best=a; } } return bd<=tol?best:v; }

/* --- a first guess from the fold lines (typical glue | back | side | front | side layout) --- */
function guessCfg(r){
  const {w,h,lines:L}=r; const fc=[...L.fold_cols].sort((a,b)=>a-b), fr=[...L.fold_rows].sort((a,b)=>a-b);
  let back,front,left,right;
  const segs=[]; for(let i=1;i<fc.length;i++) segs.push([fc[i-1],fc[i]]);
  const wide=[...segs].sort((a,b)=>(b[1]-b[0])-(a[1]-a[0])).slice(0,2).sort((a,b)=>a[0]-b[0]);
  if(wide.length===2 && wide[1][0]>wide[0][1] && wide[1][0]-wide[0][1]<(wide[1][1]-wide[1][0])){
    back=wide[0]; front=wide[1]; left=[back[1],front[0]];
    const dw=Math.max(8,left[1]-left[0]), nxt=fc.find(x=>x>front[1]+2);
    right=[front[1], nxt && nxt-front[1]<dw*1.6 ? nxt : Math.min(w,front[1]+dw)];
  } else {
    back=[w*.08,w*.33]; left=[w*.33,w*.4]; front=[w*.4,w*.65]; right=[w*.65,w*.72];
  }
  let by=null,best=0;
  for(let i=1;i<fr.length;i++){ const g=fr[i]-fr[i-1]; if(g>best){ best=g; by=[fr[i-1],fr[i]]; } }
  if(!by || best<h*0.2) by=[h*.25,h*.75];
  const dw=Math.max(8,left[1]-left[0]);
  const box=(x,[y0,y1])=>[x[0],y0,x[1],y1].map(Math.round);
  const panels={front:box(front,by),back:box(back,by),left:box(left,by),right:box(right,by),
    top:box(front,[Math.max(0,by[0]-dw),by[0]]),bottom:box(front,[by[1],Math.min(h,by[1]+dw)])};
  return {title:r.name||"",dims:estDims(panels),est:true,panels,hang:null,flat:[]};
}
function estDims(P){ const fw=P.front[2]-P.front[0], fh=Math.max(1,P.front[3]-P.front[1]), dw=P.left?P.left[2]-P.left[0]:fw*0.25, k=120/fh; return [Math.max(1,Math.round(fw*k)),Math.max(1,Math.round(dw*k)),120]; }
function scaleCfg(cfg,size,to){
  const c=JSON.parse(JSON.stringify(cfg)); if(!size||!size[0]) return c;
  const kx=to[0]/size[0], ky=to[1]/size[1];
  Object.keys(c.panels||{}).forEach(k=>{ const b=c.panels[k]; if(b) c.panels[k]=[b[0]*kx,b[1]*ky,b[2]*kx,b[3]*ky].map(Math.round); });
  return c;
}
function normBox(b,w,h){
  if(!Array.isArray(b)||b.length!==4||b.some(v=>typeof v!=="number"||!isFinite(v))) return null;
  let [x0,y0,x1,y1]=b; if(x0>x1) [x0,x1]=[x1,x0]; if(y0>y1) [y0,y1]=[y1,y0];
  x0=Math.max(0,Math.min(w-1,x0)); x1=Math.max(x0+2,Math.min(w,x1)); y0=Math.max(0,Math.min(h-1,y0)); y1=Math.max(y0+2,Math.min(h,y1));
  return [x0,y0,x1,y1].map(Math.round);
}

/* --- Claude reads the panels (the skill's step 2) --- */
let sampleFn;
async function getSample(){ if(sampleFn===undefined){ try{ sampleFn=window.claude&&window.claude.use?await window.claude.use("sample"):null; }catch(e){ sampleFn=null; } } return sampleFn; }
const AI_ERR={
  not_granted:"Auto-detect is off, so panels are placed from the fold lines. Check them before saving.",
  sampling_disabled:"Auto-detect isn't available, so panels are placed from the fold lines. Check them before saving.",
  images_unavailable:"Auto-detect isn't available, so panels are placed from the fold lines. Check them before saving.",
  capability_disabled:"Auto-detect isn't available, so panels are placed from the fold lines. Check them before saving.",
  rate_limited:"Auto-detect is busy. Try Detect panels again in a minute.",
  invalid_json:"Panels couldn't be detected. Try Detect panels again.",
  refused:"Panels couldn't be detected in this file. Adjust them under Size and panels.",
  image_rejected:"This file is too large to detect panels. Adjust them under Size and panels.",
  cancelled:"Stopped. The panels below are a best guess from the fold lines."

async function aiDetect(){
  const r=S.rnd; if(!r||!r.canvas) return;
  const sample=await getSample();
  if(!sample){ r.status="done"; r.msg="Auto-detect isn't available, so panels are placed from the fold lines. Check them before saving."; render(); return; }
  const lim=await sample.limits().catch(()=>null);
  if(!lim||!lim.images){ r.status="done"; r.msg=AI_ERR.images_unavailable; render(); return; }
  const k=Math.min(1,Math.sqrt(1.1e6/(r.w*r.h)),1568/Math.max(r.w,r.h));

  const L=r.lines, s=a=>JSON.stringify(a.map(v=>Math.round(v*k)));
  const prompt=`This image is a flat packaging dieline for a folding carton, ${sw}×${sh} pixels. Fold lines are usually red or magenta, cut lines blue, and copy-limit lines dashed purple. A script found these straight lines, in pixel coordinates of THIS image: fold rows y=${s(L.fold_rows)}, fold columns x=${s(L.fold_cols)}, cut rows y=${s(L.cut_rows)}, cut columns x=${s(L.cut_cols)}.

Find the carton's panels. Give each as a pixel box [x0,y0,x1,y1] running from fold line to fold line (use the coordinates above where they fit):
- front: the main display panel, with the logo or product name.
- back: the body panel with ingredients, directions or barcode.
- left: the side panel between back and front (the viewer's left of the front once folded). right: the side panel on the other edge of the front.
- top and bottom: the tuck flaps attached to the front's top and bottom edges. Leave out dust flaps and glue flaps.
- A panel above the back with a hole (euro/sombrero or round) is a hang tab. It is usually double-ply, so its visible height is one ply. Give its size in mm.
Read the box size W×D×H in mm (front width × side depth × height) from the title or dimension callouts if printed; use null if not printed.

Layouts differ (vertical strips, front on the left, side gussets). Reason from the fold lines and the art; don't force the typical order.

Reply with only JSON like:
{"title":"Brand Product unit carton","dims_mm":[83,18,120],"panels":{"front":[0,0,0,0],"back":[0,0,0,0],"left":[0,0,0,0],"right":[0,0,0,0],"top":[0,0,0,0],"bottom":[0,0,0,0]},"hang_tab":{"width_mm":80,"height_mm":20,"slot":"euro"},"flat":["top","bottom"],"note":"one short sentence on anything uncertain, or an empty string"}
Use null for hang_tab when there is none, and leave out any panel you cannot find.`;
  r.ctl=new AbortController(); r.status="reading"; r.msg="Finding the panels… this can take up to a minute."; render();
  try{
    const out=await sample.json(prompt,{images:[blob],signal:r.ctl.signal,modelTier:"default"});
    if(S.rnd!==r) return;
    const P={}, tol=Math.max(r.w,r.h)*0.012, xs=[...L.fold_cols,...L.cut_cols], ys=[...L.fold_rows,...L.cut_rows];
    const src=(out&&out.panels)||{};
    RENDER_PANELS.forEach(n=>{ const b=normBox(Array.isArray(src[n])?src[n].map(v=>Number(v)/k):null,r.w,r.h); if(b) P[n]=[snapTo(b[0],xs,tol),snapTo(b[1],ys,tol),snapTo(b[2],xs,tol),snapTo(b[3],ys,tol)].map(Math.round); });
    if(!P.front||!P.back) throw {code:"invalid_json"};
    const dm=Array.isArray(out.dims_mm)&&out.dims_mm.length===3&&out.dims_mm.every(v=>Number(v)>0)?out.dims_mm.map(Number):null;
    const ht=out.hang_tab&&Number(out.hang_tab.width_mm)>0&&Number(out.hang_tab.height_mm)>0?{width_mm:Number(out.hang_tab.width_mm),height_mm:Number(out.hang_tab.height_mm),slot:["euro","round","none"].includes(out.hang_tab.slot)?out.hang_tab.slot:"euro"}:null;
    const flat=Array.isArray(out.flat)?out.flat.filter(n=>["top","bottom","left","right"].includes(n)&&P[n]):[];
    r.cfg={title:String(out.title||r.name||"").slice(0,120),dims:dm||estDims(P),est:!dm,panels:P,hang:ht,flat};
    if(!r.skuId){ const m=matchSku(out.title); if(m){ r.skuId=m; r.skuAuto=true; } }
    r.status="done"; r.msg=[String(out.note||"").slice(0,300),lowResNote(r)].filter(Boolean).join(" ");

  }catch(e){
    if(S.rnd!==r) return;
    r.status="done"; r.msg=AI_ERR[e&&e.code]||"Panels couldn't be detected. Adjust them under Size and panels, or try Detect panels again."; render();

}

/* --- open a dieline --- */
async function openDieline(getCanvas,meta){
